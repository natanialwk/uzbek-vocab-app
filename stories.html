<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Özbek Madaniyati · 乌兹别克斯坦文化风情读本</title>
  <style>
    :root {
      --primary: #059669;
      --primary-dark: #047857;
      --primary-light: #ecfdf5;
      --accent: #0284c7;
      --border: #e2e8f0;
      --text: #0f172a;
      --text-muted: #64748b;
      --bg: #f8fafc;
      --radius: 16px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
      padding-bottom: 120px;
      -webkit-font-smoothing: antialiased;
    }

        /* ================================================= */
    /* 🌟 全局置顶统一导航栏 (Global Navbar) */
    /* ================================================= */
    .app-header {
      position: sticky;
      top: 0;
      left: 0;
      right: 0;
      z-index: 1000;
      background: rgba(255, 255, 255, 0.96);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-bottom: 1px solid #e2e8f0;
      box-shadow: 0 2px 12px rgba(15, 23, 42, 0.04);
      margin-bottom: 24px;
    }
    .header-inner {
      max-width: 1200px;
      margin: 0 auto;
      padding: 10px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
    }
    .brand-logo {
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none !important;
      color: #0f172a !important;
      flex-shrink: 0;
    }
    .flag-icon { font-size: 24px; line-height: 1; }
    .brand-text {
      font-size: 17px;
      font-weight: 800;
      color: #0f172a;
      letter-spacing: -0.3px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .brand-sub {
      font-size: 12px;
      font-weight: 600;
      color: #059669;
      background: #ecfdf5;
      padding: 2px 8px;
      border-radius: 6px;
      border: 1px solid #a7f3d0;
    }
    .nav-menu {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .nav-tab {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 14px;
      border-radius: 12px;
      font-size: 13.5px;
      font-weight: 700;
      color: #475569 !important;
      text-decoration: none !important;
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
      white-space: nowrap;
      box-shadow: 0 1px 2px rgba(0,0,0,0.02);
    }
    .nav-tab:hover {
      background: #f1f5f9;
      color: #0f172a !important;
      border-color: #cbd5e1;
      transform: translateY(-1px);
    }
    .nav-tab.active {
      background: linear-gradient(135deg, #0f172a, #1e293b) !important;
      color: #ffffff !important;
      border-color: #0f172a;
      box-shadow: 0 4px 12px rgba(15, 23, 42, 0.18);
    }
    .tab-badge {
      font-size: 11px;
      font-weight: 800;
      padding: 1px 6px;
      border-radius: 10px;
      background: rgba(0, 0, 0, 0.08);
      color: inherit;
    }
    .nav-tab.active .tab-badge {
      background: rgba(255, 255, 255, 0.2);
      color: #ffffff;
    }

    @media (max-width: 768px) {
      .header-inner { padding: 8px 10px; flex-direction: column; align-items: stretch; gap: 8px; }
      .brand-logo { justify-content: center; }
      .brand-text { font-size: 15px; }
      .brand-sub { font-size: 11px; }
      .nav-menu { display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; width: 100%; }
      .nav-tab { justify-content: center; padding: 7px 2px; font-size: 11.5px; }
      .tab-badge { display: none; }
    }

    .container {
      max-width: 1120px;
      margin: 0 auto;
      padding: 0 20px;
    }

    /* 页面标题 */
    .page-header {
      text-align: center;
      margin: 10px 0 24px;
    }
    .page-title {
      font-size: 28px;
      font-weight: 900;
      color: #0f172a;
      margin-bottom: 8px;
      letter-spacing: -0.5px;
    }
    .page-desc {
      font-size: 15px;
      color: #64748b;
      max-width: 720px;
      margin: 0 auto;
    }

    /* 等级筛选 */
    .filter-bar {
      display: flex;
      justify-content: center;
      gap: 8px;
      margin: 20px 0 28px;
      flex-wrap: wrap;
    }
    .filter-btn {
      padding: 7px 16px;
      border-radius: 20px;
      border: 1px solid var(--border);
      background: white;
      color: #475569;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
    }
    .filter-btn:hover { background: #f1f5f9; border-color: #cbd5e1; }
    .filter-btn.active { background: #0f172a; color: white; border-color: #0f172a; box-shadow: 0 2px 8px rgba(15,23,42,0.2); }

    /* 故事画廊网格墙 */
    
    /* ============================================== */
    /* 📋 简洁长方格故事列表样式 (Sleek Rectangular Rows) */
    /* ============================================== */
    .story-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
      max-width: 900px;
      margin: 0 auto;
    }
    .story-row-item {
      background: white;
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 12px 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      cursor: pointer;
      transition: all 0.22s cubic-bezier(0.16, 1, 0.3, 1);
      box-shadow: 0 1px 3px rgba(15, 23, 42, 0.03);
    }
    .story-row-item:hover {
      transform: translateY(-2px);
      border-color: #7c3aed;
      box-shadow: 0 8px 24px rgba(124, 58, 237, 0.09);
    }
    .story-row-left {
      display: flex;
      align-items: center;
      gap: 14px;
      flex: 1;
      min-width: 0;
    }
    .story-row-thumb {
      width: 64px;
      height: 64px;
      border-radius: 10px;
      object-fit: cover;
      flex-shrink: 0;
      border: 1px solid #e2e8f0;
    }
    .story-row-text {
      display: flex;
      flex-direction: column;
      gap: 3px;
      min-width: 0;
    }
    .story-row-title-uz {
      font-size: 16px;
      font-weight: 800;
      color: #0f172a;
      letter-spacing: -0.2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .story-row-meta {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }
    .story-row-title-cn {
      font-size: 13.5px;
      font-weight: 700;
      color: #475569;
    }
    .s-tag {
      font-size: 11px;
      font-weight: 700;
      padding: 1px 7px;
      border-radius: 6px;
      background: #f1f5f9;
      color: #64748b;
    }
    .s-tag-level { background: #f3e8ff; color: #7c3aed; }
    .s-tag-time { background: #f0fdf4; color: #166534; }
    .story-row-right {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-shrink: 0;
    }
    .story-row-count {
      font-size: 12px;
      font-weight: 700;
      color: #94a3b8;
      background: #f8fafc;
      padding: 4px 10px;
      border-radius: 20px;
      border: 1px solid #e2e8f0;
    }
    .story-row-btn {
      font-size: 13px;
      font-weight: 800;
      color: #7c3aed;
      background: #faf5ff;
      border: 1px solid #e9d5ff;
      padding: 6px 14px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      gap: 4px;
      transition: all 0.2s;
    }
    .story-row-item:hover .story-row-btn {
      background: #7c3aed;
      color: white;
      border-color: #7c3aed;
    }
    @media (max-width: 640px) {
      .story-row-item { padding: 10px 12px; gap: 10px; }
      .story-row-thumb { width: 52px; height: 52px; }
      .story-row-title-uz { font-size: 14.5px; }
      .story-row-title-cn { font-size: 12px; }
      .story-row-count { display: none; }
      .story-row-btn { padding: 5px 10px; font-size: 12px; }
    }

    .story-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 22px;
    }
    .story-card {
      background: white;
      border: 1px solid var(--border);
      border-radius: 18px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: all 0.28s cubic-bezier(0.16, 1, 0.3, 1);
      cursor: pointer;
      box-shadow: 0 2px 8px rgba(0,0,0,0.02);
      position: relative;
    }
    .story-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 16px 36px rgba(0,0,0,0.08);
      border-color: #cbd5e1;
    }

    .card-banner {
      height: 180px;
      position: relative;
      overflow: hidden;
      background: #0f172a;
    }
    .story-cover-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
      display: block;
    }
    .story-card:hover .story-cover-img { transform: scale(1.08); }
    .card-banner::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, rgba(0,0,0,0.3) 0%, transparent 40%, rgba(0,0,0,0.4) 100%);
      pointer-events: none;
    }

    .card-level-badge {
      position: absolute;
      top: 12px;
      left: 12px;
      background: rgba(15,23,42,0.75);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      color: white;
      padding: 4px 10px;
      border-radius: 10px;
      font-size: 11px;
      font-weight: 800;
      z-index: 2;
    }
    .card-time-badge {
      position: absolute;
      top: 12px;
      right: 12px;
      background: rgba(255,255,255,0.92);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      color: #0f172a;
      padding: 4px 10px;
      border-radius: 10px;
      font-size: 11px;
      font-weight: 700;
      z-index: 2;
    }

    .card-body {
      padding: 20px;
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .card-meta-row {
      font-size: 12px;
      color: #64748b;
      font-weight: 600;
      margin-bottom: 6px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .card-title-uz {
      font-size: 18px;
      font-weight: 800;
      color: #0f172a;
      margin-bottom: 3px;
      line-height: 1.3;
    }
    .card-title-cn {
      font-size: 14.5px;
      font-weight: 700;
      color: var(--primary-dark);
      margin-bottom: 10px;
    }
    .card-desc {
      font-size: 13.5px;
      color: #475569;
      line-height: 1.6;
      margin-bottom: 16px;
      flex: 1;
    }
    .card-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-top: 12px;
      border-top: 1px solid #f1f5f9;
      font-size: 12px;
    }
    .card-tag {
      color: #047857;
      background: #ecfdf5;
      padding: 3px 8px;
      border-radius: 6px;
      font-weight: 700;
    }
    .card-action-btn {
      color: var(--primary-dark);
      font-weight: 800;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    /* ================================================= */
    /* 视图 2：沉浸式阅读器 (Reader View) */
    /* ================================================= */
    #storyReaderView { display: none; }

    .reader-toolbar {
      position: sticky;
      top: 66px;
      z-index: 900;
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 10px 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 4px 16px rgba(0,0,0,0.03);
      margin-bottom: 20px;
    }
    .back-shelf-btn {
      background: #f1f5f9;
      border: 1px solid #cbd5e1;
      padding: 6px 14px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 700;
      color: #1e293b;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.15s;
    }
    .back-shelf-btn:hover { background: #e2e8f0; }

    .reader-tools {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .tool-btn {
      background: white;
      border: 1px solid var(--border);
      padding: 6px 12px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 700;
      color: #475569;
      cursor: pointer;
      transition: all 0.2s;
    }
    .tool-btn:hover { background: #f8fafc; border-color: #cbd5e1; }

    .story-article {
      background: white;
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 32px 36px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.02);
      margin-bottom: 40px;
    }
    @media (max-width: 640px) {
      .story-article { padding: 20px 16px; }
    }

    .story-article-hero {
      width: 100%;
      max-height: 380px;
      object-fit: cover;
      border-radius: 16px;
      margin-bottom: 22px;
      box-shadow: 0 10px 28px rgba(0,0,0,0.08);
      border: 1px solid var(--border);
      display: block;
    }

    .story-meta {
      border-bottom: 1px solid #f1f5f9;
      padding-bottom: 18px;
      margin-bottom: 24px;
    }
    .story-uzbek-title {
      font-size: 24px;
      font-weight: 900;
      color: #0f172a;
      margin-bottom: 4px;
    }
    .story-chinese-title {
      font-size: 16px;
      font-weight: 700;
      color: var(--primary-dark);
      margin-bottom: 10px;
    }
    .story-tags-row {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 13px;
      color: #64748b;
      font-weight: 600;
      flex-wrap: wrap;
    }

    /* 正文段落与句子伴读 */
    .story-content {
      line-height: 2.1;
      font-size: 19px;
      color: #1e293b;
    }
    .story-sentence-wrap {
      display: inline;
    }
    .story-sentence {
      padding: 2px 4px;
      border-radius: 6px;
      transition: all 0.2s;
      cursor: pointer;
    }
    .story-sentence:hover {
      background: #f1f5f9;
    }
    .story-sentence.playing {
      background: #fef08a !important;
      color: #854d0e;
      box-shadow: 0 0 0 2px #facc15;
    }

    .story-trans-box {
      font-size: 14.5px;
      color: #475569;
      background: #f8fafc;
      border-left: 3px solid var(--primary);
      padding: 8px 14px;
      margin: 8px 0 14px;
      border-radius: 0 8px 8px 0;
      display: none;
      line-height: 1.5;
    }

    /* 单词点击交互 */
    .story-word {
      cursor: pointer;
      border-radius: 4px;
      padding: 1px 2px;
      margin: 0 1px;
      transition: all 0.15s;
      display: inline-block;
    }
    .story-word:hover {
      background: #e0f2fe;
      color: #0369a1;
    }
    .story-word.selected {
      background: #38bdf8;
      color: white;
      font-weight: 800;
    }

    /* 底部悬浮控制台 */
    .floating-audio-bar {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      width: calc(100% - 40px);
      max-width: 680px;
      background: rgba(15, 23, 42, 0.95);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-radius: 20px;
      padding: 12px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      box-shadow: 0 16px 36px rgba(0,0,0,0.3);
      z-index: 1000;
      color: white;
    }
    .player-controls {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .player-btn {
      background: rgba(255,255,255,0.12);
      border: 1px solid rgba(255,255,255,0.15);
      color: white;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .player-btn:hover { background: rgba(255,255,255,0.25); transform: scale(1.06); }
    .player-btn-main {
      width: 48px;
      height: 48px;
      background: var(--primary);
      border-color: var(--primary);
      font-size: 20px;
    }
    .player-btn-main:hover {
      background: #10b981;
      transform: scale(1.08);
    }
    .player-status-text {
      font-size: 13px;
      font-weight: 700;
      color: #94a3b8;
    }
    .speed-btn {
      background: rgba(255,255,255,0.1);
      border: 1px solid rgba(255,255,255,0.15);
      color: white;
      padding: 5px 10px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 800;
      cursor: pointer;
    }

    /* 单词释义弹窗 */
    .word-bottom-sheet {
      position: fixed;
      bottom: -400px;
      left: 50%;
      transform: translateX(-50%);
      width: calc(100% - 32px);
      max-width: 500px;
      background: white;
      border: 1px solid var(--border);
      border-radius: 20px 20px 14px 14px;
      box-shadow: 0 -8px 30px rgba(0,0,0,0.15);
      padding: 20px 24px;
      z-index: 1200;
      transition: bottom 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .word-bottom-sheet.open {
      bottom: 90px;
    }
    .sheet-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }
    .sheet-word {
      font-size: 22px;
      font-weight: 900;
      color: #0f172a;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .sheet-speak-btn {
      background: #f1f5f9;
      border: 1px solid #cbd5e1;
      border-radius: 50%;
      width: 32px;
      height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 15px;
      transition: all 0.2s;
    }
    .sheet-speak-btn:hover { background: var(--primary); color: white; border-color: var(--primary); }
    .sheet-close-btn {
      background: transparent;
      border: none;
      font-size: 20px;
      color: #94a3b8;
      cursor: pointer;
    }
    .sheet-defs {
      font-size: 14.5px;
      color: #334155;
      font-weight: 600;
      margin-bottom: 16px;
      line-height: 1.5;
    }
    .sheet-actions {
      display: flex;
      gap: 10px;
    }
    .sheet-bookmark-btn {
      flex: 1;
      padding: 10px;
      border-radius: 12px;
      border: 1px solid var(--primary);
      background: var(--primary-light);
      color: var(--primary-dark);
      font-size: 13.5px;
      font-weight: 800;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: all 0.2s;
    }
    .sheet-bookmark-btn:hover { background: var(--primary); color: white; }
    .sheet-bookmark-btn.saved { background: #f1f5f9; border-color: #cbd5e1; color: #64748b; }

    /* 结语操作卡 */
    .finish-card {
      margin-top: 30px;
      padding: 24px;
      background: #f8fafc;
      border: 1px dashed #cbd5e1;
      border-radius: 16px;
      text-align: center;
    }
    .finish-title { font-size: 17px; font-weight: 800; color: #0f172a; margin-bottom: 6px; }
    .finish-desc { font-size: 13.5px; color: #64748b; margin-bottom: 16px; }
    .finish-btns { display: flex; justify-content: center; gap: 12px; flex-wrap: wrap; }
    .f-btn {
      padding: 8px 18px;
      border-radius: 12px;
      font-size: 13px;
      font-weight: 800;
      text-decoration: none;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s;
    }
    .f-btn-primary { background: #0f172a; color: white; border: 1px solid #0f172a; }
    .f-btn-secondary { background: white; color: #047857; border: 1px solid #a7f3d0; }
  </style>
</head>
<body>

  <!-- 🌟 全局置顶统一导航栏 (4大核心功能) -->
    <header class="app-header">
    <div class="header-inner">
      <a href="index.html" class="brand-logo" title="返回首页门户">
        <span class="flag-icon">🇺🇿</span>
        <span class="brand-text">Özbek Tili <span class="brand-sub">乌语学习平台</span></span>
      </a>

  <script>
    const STORIES_DATA = [{"id": "story1", "titleUz": "Toşkentda yangi döst", "titleCn": "在塔什干结识新朋友", "level": "A1 入门级", "category": "城市与社交", "image": "images/story1.jpg", "time": "⏱️ 约 2 分钟", "synopsis": "漫步于市中心帖木儿林荫步道，结识热情的大学生迪尔绍德，聊建筑、古迹与传统茶馆文化。", "sentences": [{"uzbek": "Bugun havo juda quyoşli va iliq.", "chinese": "今天天气非常晴朗温暖。", "audio": "audio/stories/story1_1.mp3"}, {"uzbek": "Anvar Toşkent markazidagi Amir Temur xiyobonida sayr qilyapti.", "chinese": "安瓦尔正在塔什干市中心的帖木儿林荫大道散步。", "audio": "audio/stories/story1_2.mp3"}, {"uzbek": "Uning yoniga bir yoş yigit keldi va: 'Salom! Siz sayyohsizmi?' deb söradi.", "chinese": "一位年轻小伙走到他身边问道：“你好！你是游客吗？”", "audio": "audio/stories/story1_3.mp3"}, {"uzbek": "Anvar tabassum qilib: 'Assalomu alaykum! Ha, men birinçi marta Toşkentga keldim,' dedi.", "chinese": "安瓦尔微笑着说：“你好！是的，我第一次来塔什干。”", "audio": "audio/stories/story1_4.mp3"}, {"uzbek": "'Mening ismim Dilşod. Men bu yerda universitetda öqiyman. Tanişingizdan xursandman!'", "chinese": "“我叫迪尔绍德。我在这里上大学。很高兴认识你！”", "audio": "audio/stories/story1_5.mp3"}, {"uzbek": "'Mening ismim Anvar. Men me'morçilik va qadimiy obidalarni yaxşi köraman.'", "chinese": "“我叫安瓦尔。我很喜欢建筑与古老遗迹。”", "audio": "audio/stories/story1_6.mp3"}, {"uzbek": "Dilşod dedi: 'Juda ajoyib! Agar xohlasangiz, sizga şaharning eng çiroyli joylarini körsataman.'", "chinese": "迪尔绍德说：“太棒了！如果你愿意，我带你去看这座城市最美丽的地方。”", "audio": "audio/stories/story1_7.mp3"}, {"uzbek": "'Katta rahmat! Qayerda milliy çoy içiş mumkin?'", "chinese": "“非常感谢！哪里能喝到地道的民族茶？”", "audio": "audio/stories/story1_8.mp3"}, {"uzbek": "'Yuring, yaqin atrofdagi qadimiy çoyxonaga boramiz. U yerda juda mazali kök çoy bor.'", "chinese": "“走吧，我们去附近的一家老茶馆。那里的绿茶非常好喝。”", "audio": "audio/stories/story1_9.mp3"}, {"uzbek": "Ular suhbatlaşib, şod-xurramlik bilan çoyxona tomon yurdilar.", "chinese": "他们一边交谈，一边欢快地朝茶馆走去。", "audio": "audio/stories/story1_10.mp3"}], "location": "📍 塔什干市中心帖木儿广场", "tag": "#城市与社交", "cover": "images/story1.jpg"}, {"id": "story2", "titleUz": "Çorsu bozorida non va mevalar", "titleCn": "琼苏巴扎买水果与烤馕", "level": "A1 入门级", "category": "购物与美食", "image": "images/story2.jpg", "time": "⏱️ 约 2.5 分钟", "synopsis": "沉浸式体验中亚千年巴扎集市的烟火气息，学习如何挑选鲜甜的红石榴与现烤出炉的酥脆帕提尔馕。", "sentences": [{"uzbek": "Ertalab Anvar va Dilşod maşhur Çorsu bozoriga bordilar.", "chinese": "早晨，安瓦尔和迪尔绍德去了著名的琼苏巴扎。", "audio": "audio/stories/story2_1.mp3"}, {"uzbek": "Bozor juda katta, gavjum va rang-barang edi.", "chinese": "集市非常庞大、热闹且色彩斑斓。", "audio": "audio/stories/story2_2.mp3"}, {"uzbek": "Bu yerda yangi uzilgan şirin uzum, şaftoli va anorlar juda köp.", "chinese": "这里有大量刚采摘的甘甜葡萄、水蜜桃和石榴。", "audio": "audio/stories/story2_3.mp3"}, {"uzbek": "Sotuvçi omonlik tilab: 'Keling, mevalardan totib köring, juda şirin!' dedi.", "chinese": "摊主热情问候道：“快来看看，尝尝水果吧，可甜了！”", "audio": "audio/stories/story2_4.mp3"}, {"uzbek": "Anvar: 'Bu anorlarning narxi qança?' deb söradi.", "chinese": "安瓦尔问：“这些石榴价格是多少？”", "audio": "audio/stories/story2_5.mp3"}, {"uzbek": "Sotuvçi: 'Bir kilosi yigirma ming söm, sizga arzonroq qilib beraman,' dedi.", "chinese": "摊主说：“一公斤两万索姆，给你算便宜点。”", "audio": "audio/stories/story2_6.mp3"}, {"uzbek": "Narx kelişilgaç, ular ikki kilo qizil anor sotib oldilar.", "chinese": "谈好价钱后，他们买了两公斤红石榴。", "audio": "audio/stories/story2_7.mp3"}, {"uzbek": "Keyin ular tandir non pişiriladigan qatorga ötdilar.", "chinese": "随后他们来到了烤制馕饼的摊位排。", "audio": "audio/stories/story2_8.mp3"}, {"uzbek": "Issiq va xuşböy patir nonning hidi butun bozorga tarqalardi.", "chinese": "热腾腾、香喷喷的帕提尔馕香气弥漫了整个巴扎。", "audio": "audio/stories/story2_9.mp3"}, {"uzbek": "'Ikkita issiq non bering, iltimos,' dedi Dilşod tabassum bilan.", "chinese": "迪尔绍德微笑着说：“请给我拿两个热馕。”", "audio": "audio/stories/story2_10.mp3"}, {"uzbek": "Bozordan söng ular tökin dasturxon atrofida non va mevalarni baham kördilar.", "chinese": "离开集市后，他们围坐在丰盛的餐布旁分享馕与水果。", "audio": "audio/stories/story2_11.mp3"}], "location": "📍 琼苏大巴扎", "tag": "#购物与美食", "cover": "images/story2.jpg"}, {"id": "story3", "titleUz": "Samarqandga tezyurar poyezdda", "titleCn": "乘坐阿夫罗西约布号高铁去撒马尔罕", "level": "A2 进阶级", "category": "交通与旅行", "image": "images/story3.jpg", "time": "⏱️ 约 2.5 分钟", "synopsis": "清晨在现代化的塔什干南站登车，乘坐飞驰的高铁穿越棉田雪山，去瞻仰丝路古都撒马尔罕的蔚蓝穹顶。", "sentences": [{"uzbek": "Bugun Anvar qadimiy va afsonaviy Samarqand şahriga jönab ketyapti.", "chinese": "今天安瓦尔启程前往古老而传奇的撒马尔罕城。", "audio": "audio/stories/story3_1.mp3"}, {"uzbek": "U erta tongda 'Toşkent-Janubiy' temir yöl vokzaliga yetib keldi.", "chinese": "他清晨抵达了塔什干南火车站。", "audio": "audio/stories/story3_2.mp3"}, {"uzbek": "Vokzal zamonaviy, toza va xavfsizlik nazorati juda tartibli edi.", "chinese": "火车站现代、整洁，安检井然有序。", "audio": "audio/stories/story3_3.mp3"}, {"uzbek": "U 'Afrosiyob' tezyurar poyezdiga çiqdi va qulay örindiqqa ötirdi.", "chinese": "他登上了‘阿夫罗西约布’号高铁，坐在舒适的座位上。", "audio": "audio/stories/story3_4.mp3"}, {"uzbek": "Poyezd öz vaqtida silliq harakatlana boşladi.", "chinese": "列车准点平稳地启动前行。", "audio": "audio/stories/story3_5.mp3"}, {"uzbek": "Poyezd xodimi yölovçilarga bepul çoy, qahva va şirinliklar tarqatdi.", "chinese": "列车乘务员为乘客分发免费的茶、咖啡和茶点点心。", "audio": "audio/stories/story3_6.mp3"}, {"uzbek": "Derazadan keng paxta dalalari va uzoqdagi qorli toğlar körinib turardi.", "chinese": "车窗外是一望无际的棉花田，远方隐现白雪皑皑的山峰。", "audio": "audio/stories/story3_7.mp3"}, {"uzbek": "Atigi ikki soatdan söng poyezd Samarqand vokzaliga kirib bordi.", "chinese": "仅仅两小时后，列车缓缓驶入了撒马尔罕站。", "audio": "audio/stories/story3_8.mp3"}, {"uzbek": "Vokzal oldida mehribon taksi haydovçilari Registon maydoniga olib borişni taklif qilişdi.", "chinese": "车站外热情友善的出租车司机主动询问是否前往雷吉斯坦广场。", "audio": "audio/stories/story3_9.mp3"}, {"uzbek": "Anvar Samarqandning moviy gumbazlarini körib, hayratda qoldi.", "chinese": "看到撒马尔罕蔚蓝色的穹顶，安瓦尔惊叹不已。", "audio": "audio/stories/story3_10.mp3"}], "location": "📍 塔什干南站至撒马尔罕", "tag": "#交通与旅行", "cover": "images/story3.jpg"}, {"id": "story4", "titleUz": "Toşkent oşi: Milliy taom", "titleCn": "塔什干手抓饭：乌兹别克斯坦国菜", "level": "A1 入门级", "category": "美食文化", "image": "images/story4.jpg", "time": "⏱️ 约 2.5 分钟", "synopsis": "探访著名的塔什干抓饭中心，看大厨在大铸铁锅中翻炒金黄米饭与黄胡萝卜，品尝地道抓饭香气。", "sentences": [{"uzbek": "Tuşlik vaqtida Dilşod Anvarni maşhur Oş markaziga taklif qildi.", "chinese": "午餐时间，迪尔绍德邀请安瓦尔去著名的手抓饭中心。", "audio": "audio/stories/story4_1.mp3"}, {"uzbek": "Bu yerda ulkan qozonlarda eng mazali milliy palov pişiriladi.", "chinese": "在这里，巨大的铁锅里正烹调着最地道的民族抓饭。", "audio": "audio/stories/story4_2.mp3"}, {"uzbek": "Usta oşpaz sariq sabzi, mayin göşt va nöxatlarni mohirlik bilan aralaştirardi.", "chinese": "抓饭大师熟练地翻炒着黄胡萝卜、鲜嫩牛肉和鹰嘴豆。", "audio": "audio/stories/story4_3.mp3"}, {"uzbek": "Atrofda zira va mayizning ajoyib xuşböy hidi anqirdi.", "chinese": "空气中弥漫着孜然和葡萄干扑鼻的诱人芳香。", "audio": "audio/stories/story4_4.mp3"}, {"uzbek": "Ular bir likopça issiq palov va aççiq-çuçuk salatini buyurtma qildilar.", "chinese": "他们点了一大盘热气腾腾的手抓饭和一份番茄洋葱沙拉。", "audio": "audio/stories/story4_5.mp3"}, {"uzbek": "Anvar oşni totib kördi va: 'Bu hayotimdagi eng mazali taom!' dedi.", "chinese": "安瓦尔尝了一口抓饭赞叹道：“这是我一生中吃过最美味的食物！”", "audio": "audio/stories/story4_6.mp3"}, {"uzbek": "Dilşod kulib: 'Oş yegandan söng albatta issiq kök çoy içiş kerak,' dedi.", "chinese": "迪尔绍德笑着说：“吃完手抓饭后，一定要喝杯热绿茶消食。”", "audio": "audio/stories/story4_7.mp3"}, {"uzbek": "Ular çoy içib, maroq bilan döstona suhbatlaşdilar.", "chinese": "他们品着热茶，愉快而惬意地聊着天。", "audio": "audio/stories/story4_8.mp3"}, {"uzbek": "Bu mehmondöstlik Anvarda juda iliq taassurot qoldirdi.", "chinese": "这份热情的款待给安瓦尔留下了格外温暖深刻的印象。", "audio": "audio/stories/story4_9.mp3"}], "location": "📍 中亚抓饭中心", "tag": "#国菜美食", "cover": "images/story4.jpg"}, {"id": "story5", "titleUz": "Toşkent metrosida sayohat", "titleCn": "搭乘艺术殿堂般的塔什干地铁", "level": "A1 入门级", "category": "城市出行", "image": "images/story5.jpg", "time": "⏱️ 约 2.5 分钟", "synopsis": "步入被誉为地下宫殿的塔什干地铁，欣赏大理石雕花立柱与水晶吊灯，体验最便捷的绿色出行。", "sentences": [{"uzbek": "Toşkent metrosi Örta Osiyodagi birinçi yerosti transportidir.", "chinese": "塔什干地铁是中亚地区最早建设的地下轨道交通。", "audio": "audio/stories/story5_1.mp3"}, {"uzbek": "Anvar va Dilşod 'Alişer Navoiy' bekatiga tuşdilar.", "chinese": "安瓦尔和迪尔绍德步入了著名的‘阿利舍尔·纳沃伊’地铁站。", "audio": "audio/stories/story5_2.mp3"}, {"uzbek": "Bekatning gözalligi haqiqiy san'at saroyiga öxşaydi.", "chinese": "车站的华美壮丽宛如一座真正的地下艺术宫殿。", "audio": "audio/stories/story5_3.mp3"}, {"uzbek": "Marmar ustunlar, moviy naqşli gumbazlar va billur qandillar nur soçardi.", "chinese": "大理石立柱、天青色花纹穹顶与晶莹的水晶吊灯交相辉映。", "audio": "audio/stories/story5_4.mp3"}, {"uzbek": "Tez orada zamonaviy va toza poyezd keldi.", "chinese": "不一会儿，一列崭新整洁的现代化地铁列车缓缓进站。", "audio": "audio/stories/story5_5.mp3"}, {"uzbek": "Yölkira narxi juda arzon, yölovçilar esa juda odobli edi.", "chinese": "车票价格非常亲民，车厢里的乘客也很有礼貌。", "audio": "audio/stories/story5_6.mp3"}, {"uzbek": "Poyezd içida bekatlar nomi özbek va ingliz tillarida e'lon qilindi.", "chinese": "车厢广播用乌兹别克语和英语清晰地播报着站名。", "audio": "audio/stories/story5_7.mp3"}, {"uzbek": "Ular 'Kosmonavtlar' bekatiga yetib borib, Moviy osmon tasvirlariga qoyil qoldilar.", "chinese": "他们到达‘宇航员’站，被蔚蓝深邃的太空壁画艺术深深吸引。", "audio": "audio/stories/story5_8.mp3"}, {"uzbek": "Metroda sayohat qiliş ham tez, ham juda zavqli böldi.", "chinese": "坐地铁游览城市不仅迅捷高效，而且赏心悦目。", "audio": "audio/stories/story5_9.mp3"}], "location": "📍 塔什干地下铁道", "tag": "#城市出行", "cover": "images/story5.jpg"}, {"id": "story6", "titleUz": "Oilaviy mehmondöstlik va çoy", "titleCn": "做客乌兹别克家庭与传统茶礼", "level": "A1 入门级", "category": "民俗情谊", "image": "images/story6.jpg", "time": "⏱️ 约 2.5 分钟", "synopsis": "走进绿荫遮阳的乌兹别克庭院，坐在雕花木榻上，感受“三巡斟茶”的崇高待客礼节与家的温情。", "sentences": [{"uzbek": "Dilşod Anvarni öz xonadoniga mehmonga taklif qildi.", "chinese": "迪尔绍德热情邀请安瓦尔到自己家里做客。", "audio": "audio/stories/story6_1.mp3"}, {"uzbek": "Hovlida uzum zanglari soyasida çiroyli yoğoç söri (tapçan) bor edi.", "chinese": "小院里的葡萄藤绿荫下，摆放着漂亮的雕花木榻（塔普羌）。", "audio": "audio/stories/story6_2.mp3"}, {"uzbek": "Dilşodning buvisi mehmonni oçiq yuz va tabassum bilan kutib oldi.", "chinese": "迪尔绍德的奶奶满面笑容、热情亲切地迎接着客人。", "audio": "audio/stories/story6_3.mp3"}, {"uzbek": "Dasturxonga quritilgan mevalar, yonğoqlar va asal qöyildi.", "chinese": "长条餐布上摆满了风干果脯、酥脆坚果和香甜蜂蜜。", "audio": "audio/stories/story6_4.mp3"}, {"uzbek": "Buvi çoynakdagi çoyni piyolaga uç marta qaytardi.", "chinese": "奶奶将茶壶里的热茶倒进茶碗，连续三次斟回壶中充分润茶。", "audio": "audio/stories/story6_5.mp3"}, {"uzbek": "U hurmat bilan piyolani öng qöli bilan Anvarga uzatdi.", "chinese": "她微笑着将右手抚胸，用右手毕恭毕敬地将茶碗递到安瓦尔手中。", "audio": "audio/stories/story6_6.mp3"}, {"uzbek": "'Mehmon – otangdek aziz,' dedi buvi samimiy ohangda.", "chinese": "奶奶真诚地说：“在乌兹别克人家，‘客人如父亲般尊贵’。”", "audio": "audio/stories/story6_7.mp3"}, {"uzbek": "Anvar çoyni içib, özini öz uyidagidek qulay his qildi.", "chinese": "安瓦尔轻啜绿茶，感受到了如在自己家般的舒心与温暖。", "audio": "audio/stories/story6_8.mp3"}, {"uzbek": "Bu çinakam samimiy mehr heç qaçon unutilmaydi.", "chinese": "这份真挚纯朴的温情永远留在了他的心底。", "audio": "audio/stories/story6_9.mp3"}], "location": "📍 传统老城院落 (Hovli)", "tag": "#民俗情谊", "cover": "images/story6.jpg"}, {"id": "story7", "titleUz": "Buxoroda Registon va qadimiy ark", "titleCn": "漫步布哈拉古城与千年方舟要塞", "level": "A2 进阶级", "category": "古城探秘", "image": "images/story7.jpg", "time": "⏱️ 约 3 分钟", "synopsis": "漫步于千年古都布哈拉，仰望高耸入云的卡扬宣礼塔与落日余晖中雄浑沧桑的方舟要塞城墙。", "sentences": [{"uzbek": "Ertasi kuni sayohatçilar afsonaviy Buxoro şahriga yetib keldilar.", "chinese": "次日，旅人们抵达了充满传奇神韵的丝路古都布哈拉。", "audio": "audio/stories/story7_1.mp3"}, {"uzbek": "Buxoro köçalari göyo ötmiş asrlardan sözlayotgandek tuyulardi.", "chinese": "布哈拉的街巷仿佛在静静倾诉着数百年来的悠悠往事。", "audio": "audio/stories/story7_2.mp3"}, {"uzbek": "Ular avval qadimiy hukmdorlar saroyi bölgan Ark qal'asiga bordilar.", "chinese": "他们首先来到了昔日历代埃米尔的王宫——雄伟的方舟要塞。", "audio": "audio/stories/story7_3.mp3"}, {"uzbek": "Arkning baland va mahobatli ğiştin devorlari har bir odamni hayratga soladi.", "chinese": "要塞高耸雄浑的泥砖夯土城墙，令每一位到访者肃然起敬。", "audio": "audio/stories/story7_4.mp3"}, {"uzbek": "Qarşida osmonöpar Minorai Kalon qad kötarib turardi.", "chinese": "而在正对面，高耸入云的卡扬大宣礼塔傲然挺立在蓝天下。", "audio": "audio/stories/story7_5.mp3"}, {"uzbek": "Gid aytişiça, bu minora hatto Çingizxon davrida ham omon qolgan.", "chinese": "导游讲解说，这座千年宣礼塔甚至在成吉思汗西征浩劫中也完好保留。", "audio": "audio/stories/story7_6.mp3"}, {"uzbek": "Keçki payt şahar ustiga oltin rang quyoş nurlari yoğildi.", "chinese": "黄昏降临，夕阳金辉倾泻在整座古老砖石砌就的城池上。", "audio": "audio/stories/story7_7.mp3"}, {"uzbek": "Anvar bu sehrli lahzani öz kamerasiga muhrlab qöydi.", "chinese": "安瓦尔举起相机，将这一震撼心灵的金色瞬间定格珍藏。", "audio": "audio/stories/story7_8.mp3"}, {"uzbek": "Tarix va bugungi kun bu yerda ajoyib uyğunlik hosil qilgan edi.", "chinese": "历史的厚重与当下的宁静在这片中亚热土上交融得恰到好处。", "audio": "audio/stories/story7_9.mp3"}], "location": "📍 布哈拉古城·埃米尔方舟", "tag": "#古城探秘", "cover": "images/story7.jpg"}, {"id": "story8", "titleUz": "Ipak gilamlari va hunarmandlar", "titleCn": "寻访丝绸之路的手工真丝地毯", "level": "A2 进阶级", "category": "传统工艺", "image": "images/story8.jpg", "time": "⏱️ 约 3 分钟", "synopsis": "探访撒马尔罕百年手工地毯工坊，观摩巧手匠人如何用天然植物染料与纯蚕丝编织出绚烂的几何梦境。", "sentences": [{"uzbek": "Bugun Anvar va Dilşod an'anaviy ipak gilam töqiş ustaxonasiga taşrif buyurdilar.", "chinese": "今天安瓦尔和迪尔绍德参观了一家传统手工真丝地毯编织作坊。", "audio": "audio/stories/story8_1.mp3"}, {"uzbek": "Ustaxonada tabiiy ösimliklardan olingan yorqin böyoqlar namoyiş etildi.", "chinese": "作坊里陈列着用石榴皮、茜草和胡桃壳等天然植物提取的矿物染料。", "audio": "audio/stories/story8_2.mp3"}, {"uzbek": "Mohir qizlar yoğoç dastgohlarda sabr-toqat bilan gilam töqişardi.", "chinese": "手巧的心灵织娘在立式木制织机前耐心细致地飞梭编织。", "audio": "audio/stories/story8_3.mp3"}, {"uzbek": "Har bir tugun ipak tolasining nozik gözalligini aks ettirardi.", "chinese": "每一个细密的经纬结，都凝聚着纯天然桑蚕丝的温润质感。", "audio": "audio/stories/story8_4.mp3"}, {"uzbek": "'Bitta gilamni töqiş uçun bir neça oy, ba'zan bir yil kerak,' dedi usta.", "chinese": "工坊师傅介绍道：“编织一条精品地毯需要数月，有时甚至整整一年。”", "audio": "audio/stories/story8_5.mp3"}, {"uzbek": "Gilamlardagi naqşlar ota-bobolardan meros qolgan ramziy ma'nolarga ega.", "chinese": "地毯上的几何纹饰更蕴含着历代先祖代代相传的吉祥祈福之意。", "audio": "audio/stories/story8_6.mp3"}, {"uzbek": "Anvar ipakning mayin va jiloli yaltiraşiga qöl tekkizib hayron böldi.", "chinese": "安瓦尔轻轻抚摸着如流水般丝滑光洁的绸面，不禁叹服。", "audio": "audio/stories/story8_7.mp3"}, {"uzbek": "U kiçik bir ipak suvenir sotib olib, hunarmandlarga minnatdorlik bildirdi.", "chinese": "他选购了一件精美的丝织小挂件，由衷向手艺人致以敬意。", "audio": "audio/stories/story8_8.mp3"}, {"uzbek": "Qadimiy hunarmandçilik an'analari bugun ham gullab-yaşnamoqda.", "chinese": "古老的丝路匠心手作在现代社会中依然绽放着耀眼光芒。", "audio": "audio/stories/story8_9.mp3"}], "location": "📍 丝绸地毯手工坊", "tag": "#传统工艺", "cover": "images/story8.jpg"}, {"id": "story9", "titleUz": "Navröz bayrami va Sumalak", "titleCn": "喜迎纳乌鲁斯春分节与熬制苏玛拉克", "level": "A2 进阶级", "category": "节日庆典", "image": "images/story9.jpg", "time": "⏱️ 约 3 分钟", "synopsis": "参与中亚最隆重的春耕新年纳乌鲁斯节，围着铜锅一边敲手鼓对歌，一边通宵熬制象征丰饶希望的苏玛拉克。", "sentences": [{"uzbek": "Bahor kelişi bilan Özbekistonda eng uluğ bayram – Navröz nişonlanadi.", "chinese": "伴随着大地回春，乌兹别克斯坦迎来了最盛大的传统佳节——纳乌鲁斯春耕节。", "audio": "audio/stories/story9_1.mp3"}, {"uzbek": "Hamma joyda bodom va şaftoli gullari oçilib, tabiat uyğonadi.", "chinese": "大街小巷巴旦木与杏桃花开如云，万物破土复苏生机盎然。", "audio": "audio/stories/story9_2.mp3"}, {"uzbek": "Katta maydonda ayollar katta mis qozonda sumalak pişirişardi.", "chinese": "在宽敞的节日广场上，盛装的妇女们正围着大铜锅熬煮甜品苏玛拉克。", "audio": "audio/stories/story9_3.mp3"}, {"uzbek": "Sumalak unib çiqqan buğdoy maysalaridan tayyorlanadigan şirin taomdir.", "chinese": "苏玛拉克是由新鲜发芽的翠绿麦苗历经数十小时精心熬制而成的春之甜点。", "audio": "audio/stories/story9_4.mp3"}, {"uzbek": "Qozon tagiga kiçik toşçalar solinib, keçasi bilan aralaştiriladi.", "chinese": "铜锅底部会放入洗净的小鹅卵石防焦，人们围着锅通宵达旦地轮流搅拌。", "audio": "audio/stories/story9_5.mp3"}, {"uzbek": "Qizlar doira çalib, quvnoq xalq qöşiqlarini kuylaşardi.", "chinese": "姑娘们敲击着清脆的多伊拉手鼓，唱响欢快的乌兹别克民谣。", "audio": "audio/stories/story9_6.mp3"}, {"uzbek": "Dilşod Anvarga: 'Sumalak aralaştirganingda niyat qilsang, albatta amalga oşadi,' dedi.", "chinese": "迪尔绍德对安瓦尔说：“搅动锅木勺时许下心愿，新的一年必定美梦成真。”", "audio": "audio/stories/story9_7.mp3"}, {"uzbek": "Anvar qozonni aralaştirib, tinçlik va döstlik tiladi.", "chinese": "安瓦尔握住木柄缓缓搅动，真诚祈愿世界和平、友谊长青。", "audio": "audio/stories/story9_8.mp3"}, {"uzbek": "Bayram şukuhi barçaga çeksiz quvonç va yangilaniş ulaşdi.", "chinese": "欢腾的节日庆典为每个人带来了无尽的喜悦与欣欣向荣的希望。", "audio": "audio/stories/story9_9.mp3"}], "location": "📍 节日社区广场", "tag": "#节日庆典", "cover": "images/story9.jpg"}, {"id": "story10", "titleUz": "Xiva: Oçiq osmon ostidagi muzey", "titleCn": "童话古城：漫步希瓦伊钦卡拉露天博物馆", "level": "A2 进阶级", "category": "世界遗产", "image": "images/story10.jpg", "time": "⏱️ 约 3 分钟", "synopsis": "踏入沙漠深处的童话土堡希瓦伊钦卡拉，触摸未完工的卡尔塔米纳尔蓝绿琉璃矮塔，置身一千零一夜的奇幻梦境。", "sentences": [{"uzbek": "Sayohatçilarning sönggi manzili qadimiy Xorazm vohasidagi Xiva şahri böldi.", "chinese": "旅人们此行的终点站，是深藏在古花剌子模绿洲之中的沙漠古堡希瓦。", "audio": "audio/stories/story10_1.mp3"}, {"uzbek": "Içan Qal'a devorlaridan içkariga kirgan odam özini örta asrlarda his qiladi.", "chinese": "当人们穿过伊钦卡拉厚重的泥土城门，仿佛瞬间跌入了中世纪的时空穿梭中。", "audio": "audio/stories/story10_2.mp3"}, {"uzbek": "Bu yer haqli ravişda 'oçiq osmon ostidagi muzey' deb ataladi.", "chinese": "这里完整保留着古建街巷，被誉为名副其实的‘露天活体博物馆’。", "audio": "audio/stories/story10_3.mp3"}, {"uzbek": "Baland va moviy koşinlar bilan bezatilgan Kalta Minor minorasi közni qamaştiradi.", "chinese": "虽未完工却通体镶嵌着蔚蓝水绿色琉璃瓷砖的卡尔塔米纳尔塔令人叹为观止。", "audio": "audio/stories/story10_4.mp3"}, {"uzbek": "Juma masjididagi ikki yuzdan ortiq öymakor yoğoç ustunlar betakror san'at namunasidir.", "chinese": "主麻清真寺里两百多根雕花木柱形态各异，堪称木雕工艺的无上杰作。", "audio": "audio/stories/story10_5.mp3"}, {"uzbek": "Quyoş botayotganda loy devorlar qizğiş oltin tusga kirdi.", "chinese": "夕阳西坠，漫漫黄沙背景下古老的生土高墙泛起瑰丽的赤金色光芒。", "audio": "audio/stories/story10_6.mp3"}, {"uzbek": "Anvar baland minoraga çiqib, butun voha manzarasini tomoşa qildi.", "chinese": "安瓦尔登上瞭望城堞，俯瞰着整座沙漠明珠古城的壮美全景。", "audio": "audio/stories/story10_7.mp3"}, {"uzbek": "'Özbekistonning mehmondöstligi va madaniyati qalbimda abadiy qoladi,' dedi Anvar.", "chinese": "“乌兹别克斯坦的淳朴热情与辉煌文明，将永远铭刻在我的心中，”安瓦尔感叹道。", "audio": "audio/stories/story10_8.mp3"}, {"uzbek": "Uşbu unutilmas sayohat yangi orzular va mustahkam döstlik bilan yakunlandi.", "chinese": "这段难忘的丝路漫游在崭新的憧憬与深厚的跨国友谊中圆满落幕。", "audio": "audio/stories/story10_9.mp3"}], "location": "📍 希瓦伊钦·卡拉内城", "tag": "#世界遗产", "cover": "images/story10.jpg"}];

i", "level": "A2", "type": "世界遗产", "defs": ["【童话古城：漫步希瓦伊钦卡拉露天博物馆】核心词汇"]}, "ushbu": {"lemma": "Ushbu", "level": "A2", "type": "世界遗产", "defs": ["【童话古城：漫步希瓦伊钦卡拉露天博物馆】核心词汇"]}, "unutilmas": {"lemma": "Unutilmas", "level": "A2", "type": "世界遗产", "defs": ["【童话古城：漫步希瓦伊钦卡拉露天博物馆】核心词汇"]}, "orzular": {"lemma": "Orzular", "level": "A2", "type": "世界遗产", "defs": ["【童话古城：漫步希瓦伊钦卡拉露天博物馆】核心词汇"]}, "mustahkam": {"lemma": "Mustahkam", "level": "A2", "type": "世界遗产", "defs": ["【童话古城：漫步希瓦伊钦卡拉露天博物馆】核心词汇"]}, "yakunlandi": {"lemma": "Yakunlandi", "level": "A2", "type": "世界遗产", "defs": ["【童话古城：漫步希瓦伊钦卡拉露天博物馆】核心词汇"]}};
    const STORAGE_KEY = 'uzbek_vocab_data_v1200';

    let currentStoryIdx = 0;
    let currentSentenceIdx = 0;
    let storyPlaying = false;
    let storyAudio = new Audio();
    let storySpeed = 1.0;
    let showTrans = false;
    let fontSize = 19;
    let activeInspectWordData = null;

    document.addEventListener('DOMContentLoaded', () => {
      renderStoryGrid();
    });

    function renderStoryGrid(levelFilter = 'ALL') {
      const grid = document.getElementById('storyGrid');
      grid.innerHTML = '';

      STORIES_DATA.forEach((s, idx) => {
        const isA1 = s.level.includes('A1');
        const code = isA1 ? 'A1' : 'A2';
        if (levelFilter !== 'ALL' && code !== levelFilter) return;

        const row = document.createElement('div');
        row.className = 'story-row-item';
        row.onclick = () => openStory(idx);

        row.innerHTML = `
          <div class="story-row-left">
            <img src="${s.cover || ('images/' + s.id + '.jpg')}" alt="${s.titleCn}" class="story-row-thumb" loading="lazy">
            <div class="story-row-text">
              <div class="story-row-title-uz">${s.titleUz}</div>
              <div class="story-row-meta">
                <span class="story-row-title-cn">${s.titleCn}</span>
                <span class="s-tag s-tag-level">${s.level}</span>
                <span class="s-tag">${s.location || '乌兹别克斯坦'}</span>
                <span class="s-tag s-tag-time">${s.time || '⏱️ 约 2.5 分钟'}</span>
              </div>
            </div>
          </div>
          <div class="story-row-right">
            <span class="story-row-count">${s.sentences.length} 句伴读</span>
            <span class="story-row-btn">伴读进入 →</span>
          </div>
        `;
        grid.appendChild(row);
      });
    }

    function filterLevel(level, btn) {
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      if (btn) btn.classList.add('active');
      renderStoryGrid(level);
    }

    function openStory(idx) {
      currentStoryIdx = idx;
      currentSentenceIdx = 0;
      pauseStoryPlay();

      document.getElementById('catalogView').style.display = 'none';
      document.getElementById('storyReaderView').style.display = 'block';
      window.scrollTo({ top: 0, behavior: 'smooth' });

      renderStoryView();
    }

    function showCatalog() {
      pauseStoryPlay();
      closeWordSheet();
      document.getElementById('storyReaderView').style.display = 'none';
      document.getElementById('catalogView').style.display = 'block';
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function renderStoryView() {
      const s = STORIES_DATA[currentStoryIdx];
      if (!s) return;

      document.getElementById('storyHeroImg').src = s.cover || ('images/' + s.id + '.jpg');
      document.getElementById('storyUzbekTitle').textContent = s.titleUz;
      document.getElementById('storyChineseTitle').textContent = s.titleCn;
      document.getElementById('storyLevelBadge').textContent = s.level;
      document.getElementById('storyLocation').textContent = s.location || '📍 乌兹别克斯坦';
      document.getElementById('storySentenceCount').textContent = `共 ${s.sentences.length} 句`;

      const body = document.getElementById('storyContentBody');
      body.innerHTML = '';

      s.sentences.forEach((sent, sIdx) => {
        const wrap = document.createElement('span');
        wrap.className = 'story-sentence-wrap';

        const span = document.createElement('span');
        span.className = 'story-sentence';
        span.id = `sentSpan_${sIdx}`;
        span.innerHTML = formatSentenceWords(sent.uzbek, sIdx);
        span.onclick = (e) => {
          if (e.target.classList.contains('story-word')) return;
          playSpecificSentence(sIdx);
        };
        wrap.appendChild(span);

        const trans = document.createElement('div');
        trans.className = 'story-trans-box';
        trans.id = `transBox_${sIdx}`;
        trans.textContent = sent.chinese;
        if (showTrans) trans.style.display = 'block';
        wrap.appendChild(trans);

        body.appendChild(wrap);
        body.appendChild(document.createTextNode(' '));
      });

      highlightSentence(currentSentenceIdx);
    }

    function formatSentenceWords(text, sIdx) {
      return text.replace(/([a-zA-Z'‘’`ʻ]+)/g, function(match) {
        let prefix = '', suffix = '', word = match;
        while (word.startsWith("'") || word.startsWith("‘") || word.startsWith("’") || word.startsWith("`")) {
          prefix += word[0]; word = word.slice(1);
        }
        while (word.endsWith("'") || word.endsWith("‘") || word.endsWith("’") || word.endsWith("`")) {
          suffix = word.slice(-1) + suffix; word = word.slice(0, -1);
        }
        if (!word) return match;
        const safe = word.replace(/'/g, "\'");
        return `${prefix}<span class="story-word" onclick="inspectWord(event, '${safe}', ${sIdx})">${word}</span>${suffix}`;
      });
    }

    function inspectWord(e, rawWord, sIdx) {
      if (e) e.stopPropagation();
      const clean = rawWord.replace(/[^A-Za-z'‘’`ʻ]/g, '').toLowerCase().replace(/['‘’`ʻ]/g, "_");

      document.querySelectorAll('.story-word.selected').forEach(el => el.classList.remove('selected'));
      if (e && e.target) e.target.classList.add('selected');

      let info = LEMMA_MAP[clean];
      if (!info) {
        info = {
          lemma: rawWord,
          level: "A1",
          type: "常用词汇",
          defs: [rawWord]
        };
      }

      activeInspectWordData = { ...info, cleanKey: clean, rawWord, sIdx };

      document.getElementById('sheetUzbekWord').textContent = info.lemma;
      document.getElementById('sheetDefsList').textContent = (info.defs || []).join('；');

      updateBookmarkUI(info.lemma);
      document.getElementById('wordBottomSheet').classList.add('open');
    }

    function closeWordSheet() {
      document.getElementById('wordBottomSheet').classList.remove('open');
      document.querySelectorAll('.story-word.selected').forEach(el => el.classList.remove('selected'));
    }

    function speakCurrentWord() {
      if (!activeInspectWordData) return;
      const key = activeInspectWordData.cleanKey;
      const audio = new Audio(`audio/words/${key}.mp3`);
      audio.onerror = () => {
        if ('speechSynthesis' in window) {
          const u = new SpeechSynthesisUtterance(activeInspectWordData.lemma);
          u.lang = 'uz-UZ';
          window.speechSynthesis.speak(u);
        }
      };
      audio.play().catch(() => {});
    }

    function updateBookmarkUI(lemma) {
      const btn = document.getElementById('sheetBookmarkBtn');
      const saved = getSavedVocab();
      const exists = saved.some(i => i.uzbek && i.uzbek.toLowerCase() === lemma.toLowerCase());
      if (exists) {
        btn.classList.add('saved');
        document.getElementById('bookmarkText').textContent = '已在生词库中';
      } else {
        btn.classList.remove('saved');
        document.getElementById('bookmarkText').textContent = '收藏生词到核心词汇馆';
      }
    }

    function toggleBookmarkWord() {
      if (!activeInspectWordData) return;
      const lemma = activeInspectWordData.lemma;
      const saved = getSavedVocab();
      const exists = saved.some(i => i.uzbek && i.uzbek.toLowerCase() === lemma.toLowerCase());
      if (exists) {
        alert(`“${lemma}” 已经在您的词库中了！`);
        return;
      }
      const newItem = {
        no: saved.length + 1,
        uzbek: lemma,
        chinese: (activeInspectWordData.defs || []).join('；'),
        level: activeInspectWordData.level || "A1",
        category: STORIES_DATA[currentStoryIdx].category || "文化读本生词",
        type: activeInspectWordData.type || "常用词",
        exUz: "",
        exCn: ""
      };
      saved.push(newItem);
      localStorage.setItem(STORAGE_KEY, JSON.stringify(saved));
      updateBookmarkUI(lemma);
      alert(`🎉 成功将 “${lemma}” 收藏至核心词汇馆！`);
    }

    function getSavedVocab() {
      try {
        const s = localStorage.getItem(STORAGE_KEY);
        if (s) return JSON.parse(s) || [];
      } catch(e) {}
      return [];
    }

    // 音频播放控制
    function highlightSentence(idx) {
      document.querySelectorAll('.story-sentence').forEach(el => el.classList.remove('playing'));
      const span = document.getElementById(`sentSpan_${idx}`);
      if (span) {
        span.classList.add('playing');
        span.scrollIntoView({ behavior: 'smooth', block: 'center' });
      }
      const total = STORIES_DATA[currentStoryIdx].sentences.length;
      document.getElementById('playerStatusText').textContent = `伴读中: ${idx + 1} / ${total}`;
    }

    function playSpecificSentence(idx) {
      currentSentenceIdx = idx;
      playCurrentSentence();
    }

    let storyRepeatMode = 'all'; // 'all' (全文连续), 'single' (单句循环)

    function updateStoryMediaSession(s, sent, index) {
      if ('mediaSession' in navigator) {
        navigator.mediaSession.metadata = new MediaMetadata({
          title: sent.uzbek,
          artist: `${s.titleCn} (${index + 1}/${s.sentences.length})`,
          album: "乌兹别克斯坦文化风情读本",
          artwork: [
            { src: s.cover || ('images/' + s.id + '.jpg'), sizes: '512x512', type: 'image/jpeg' }
          ]
        });
        navigator.mediaSession.setActionHandler('play', () => {
          if (!storyPlaying) togglePlayStory();
        });
        navigator.mediaSession.setActionHandler('pause', () => {
          if (storyPlaying) togglePlayStory();
        });
        navigator.mediaSession.setActionHandler('previoustrack', () => {
          prevSentence();
        });
        navigator.mediaSession.setActionHandler('nexttrack', () => {
          nextSentence();
        });
      }
    }

    function toggleStoryRepeatMode() {
      storyRepeatMode = (storyRepeatMode === 'all') ? 'single' : 'all';
      const btn = document.getElementById('btnStoryRepeatMode');
      if (btn) {
        if (storyRepeatMode === 'single') {
          btn.innerHTML = '🔂 单句循环';
          btn.classList.add('active');
          showToast('🔂 已开启【单句循环】模式');
        } else {
          btn.innerHTML = '🔁 全文连播';
          btn.classList.remove('active');
          showToast('🔁 已开启【全文连播】模式');
        }
      }
    }

    function replayStorySentence() {
      playCurrentSentence();
      showToast('⏮️ 正在重听本句');
    }

    function playCurrentSentence() {
      const s = STORIES_DATA[currentStoryIdx];
      if (!s || !s.sentences[currentSentenceIdx]) return;

      const sent = s.sentences[currentSentenceIdx];
      highlightSentence(currentSentenceIdx);
      updateStoryMediaSession(s, sent, currentSentenceIdx);

      storyAudio.src = sent.audio;
      storyAudio.playbackRate = storySpeed;

      storyAudio.onended = () => {
        if (!storyPlaying) return;

        if (storyRepeatMode === 'single') {
          // 单句循环
          setTimeout(() => {
            if (storyPlaying) playCurrentSentence();
          }, 400);
        } else {
          if (currentSentenceIdx < s.sentences.length - 1) {
            currentSentenceIdx++;
            playCurrentSentence();
          } else {
            pauseStoryPlay();
            document.getElementById('playerStatusText').textContent = '本篇已播完 · 点击重听';
          }
        }
      };

      storyAudio.play().catch(err => {
        console.warn("Story audio play catch:", err);
      });
      storyPlaying = true;
      const mainBtn = document.getElementById('playerMainBtn');
      if (mainBtn) mainBtn.textContent = '⏸';
    }

    function prevSentence() {
      if (currentSentenceIdx > 0) {
        currentSentenceIdx--;
        playCurrentSentence();
      }
    }

    function nextSentence() {
      const s = STORIES_DATA[currentStoryIdx];
      if (s && currentSentenceIdx < s.sentences.length - 1) {
        currentSentenceIdx++;
        playCurrentSentence();
      }
    }

    function toggleSpeed() {
      const speeds = [1.0, 0.8, 1.2];
      const nextIdx = (speeds.indexOf(storySpeed) + 1) % speeds.length;
      storySpeed = speeds[nextIdx];
      storyAudio.playbackRate = storySpeed;
      document.getElementById('speedBtn').textContent = storySpeed + 'x';
    }

    function toggleTranslation() {
      showTrans = !showTrans;
      document.querySelectorAll('.story-trans-box').forEach(el => {
        el.style.display = showTrans ? 'block' : 'none';
      });
      document.getElementById('transBtnText').textContent = showTrans ? '隐藏译文' : '显示译文';
    }

    function adjustFontSize(delta) {
      fontSize = Math.max(15, Math.min(28, fontSize + delta));
      document.getElementById('storyContentBody').style.fontSize = fontSize + 'px';
    }
  </script>
</body>
