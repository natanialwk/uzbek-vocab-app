<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Özbek Tili · 乌兹别克语 Quizlet 单词自测挑战</title>
  <style>
    :root {
      --primary: #059669;
      --primary-dark: #047857;
      --accent-orange: #ea580c;
      --accent-blue: #0284c7;
      --accent-purple: #7c3aed;
      --border: #e2e8f0;
      --text: #0f172a;
      --text-muted: #64748b;
      --bg: #f8fafc;
      --radius: 18px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      -webkit-font-smoothing: antialiased;
      padding-bottom: 60px;
    }

    /* 全局置顶统一导航栏 */
    .app-header {
      position: sticky;
      top: 0;
      left: 0;
      right: 0;
      z-index: 1000;
      background: rgba(255, 255, 255, 0.96);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-bottom: 1px solid #e2e8f0;
      box-shadow: 0 2px 12px rgba(15, 23, 42, 0.04);
      margin-bottom: 20px;
    }
    .header-inner {
      max-width: 1200px;
      margin: 0 auto;
      padding: 10px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
    }
    .brand-logo {
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none !important;
      color: #0f172a !important;
      flex-shrink: 0;
    }
    .flag-icon { font-size: 24px; line-height: 1; }
    .brand-text {
      font-size: 17px;
      font-weight: 800;
      color: #0f172a;
      letter-spacing: -0.3px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .brand-sub {
      font-size: 12px;
      font-weight: 600;
      color: #059669;
      background: #ecfdf5;
      padding: 2px 8px;
      border-radius: 6px;
      border: 1px solid #a7f3d0;
    }
    .nav-menu {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .nav-tab {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 14px;
      border-radius: 12px;
      font-size: 13.5px;
      font-weight: 700;
      color: #475569 !important;
      text-decoration: none !important;
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
      white-space: nowrap;
      box-shadow: 0 1px 2px rgba(0,0,0,0.02);
    }
    .nav-tab:hover {
      background: #f1f5f9;
      color: #0f172a !important;
      border-color: #cbd5e1;
      transform: translateY(-1px);
    }
    .nav-tab.active {
      background: linear-gradient(135deg, #0f172a, #1e293b) !important;
      color: #ffffff !important;
      border-color: #0f172a;
      box-shadow: 0 4px 12px rgba(15, 23, 42, 0.18);
    }

    @media (max-width: 768px) {
      .header-inner { padding: 8px 10px; flex-direction: column; align-items: stretch; gap: 8px; }
      .brand-logo { justify-content: center; }
      .brand-text { font-size: 15px; }
      .brand-sub { font-size: 11px; }
      .nav-menu { display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; width: 100%; }
      .nav-tab { justify-content: center; padding: 7px 2px; font-size: 11.5px; }
    }

    .container {
      max-width: 680px;
      margin: 0 auto;
      padding: 0 16px;
      width: 100%;
    }

    /* 🎮 测验面板顶部信息栏 */
    .quiz-dashboard {
      background: white;
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 14px 20px;
      box-shadow: 0 2px 10px rgba(15, 23, 42, 0.03);
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }
    .dash-item {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 13.5px;
      font-weight: 800;
      color: #475569;
    }
    .dash-val {
      font-size: 17px;
      font-weight: 900;
      color: #0f172a;
    }
    .val-streak {
      color: #ea580c;
    }

    /* 进度条 */
    .progress-track {
      width: 100%;
      height: 8px;
      background: #e2e8f0;
      border-radius: 6px;
      overflow: hidden;
      margin-bottom: 20px;
    }
    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, #ea580c, #f97316);
      width: 0%;
      transition: width 0.3s ease;
      border-radius: 6px;
    }

    /* 模式与主题选择标签栏 */
    .filter-row {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 8px;
      margin-bottom: 18px;
      scrollbar-width: none;
    }
    .filter-row::-webkit-scrollbar { display: none; }
    .pill-btn {
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 12.5px;
      font-weight: 700;
      border: 1px solid var(--border);
      background: white;
      color: #64748b;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s;
    }
    .pill-btn:hover {
      background: #f1f5f9;
      color: #0f172a;
    }
    .pill-btn.active {
      background: #0f172a;
      color: white;
      border-color: #0f172a;
    }

    /* 🎯 问题卡片 (Main Question Card) */
    .question-card {
      background: white;
      border: 1px solid var(--border);
      border-radius: 22px;
      padding: 32px 24px;
      box-shadow: 0 10px 30px rgba(15, 23, 42, 0.05);
      text-align: center;
      position: relative;
      margin-bottom: 20px;
      transition: all 0.3s;
    }
    .question-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 11.5px;
      font-weight: 800;
      padding: 3px 10px;
      border-radius: 12px;
      background: #f1f5f9;
      color: #475569;
      margin-bottom: 14px;
    }
    .question-prompt {
      font-size: 13px;
      font-weight: 700;
      color: #94a3b8;
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .question-chinese {
      font-size: 34px;
      font-weight: 900;
      color: #0f172a;
      letter-spacing: -0.5px;
      line-height: 1.3;
      margin-bottom: 12px;
    }
    .question-hint {
      font-size: 13px;
      color: #64748b;
      min-height: 20px;
    }

    /* 4 个乌语选项网格 (Options Grid) */
    .options-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 12px;
      margin-bottom: 22px;
    }
    .option-btn {
      background: white;
      border: 2px solid #e2e8f0;
      border-radius: 16px;
      padding: 16px 20px;
      font-size: 18px;
      font-weight: 800;
      color: #0f172a;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      transition: all 0.18s cubic-bezier(0.16, 1, 0.3, 1);
      box-shadow: 0 2px 6px rgba(0,0,0,0.02);
      text-align: left;
    }
    .option-btn:hover:not(:disabled) {
      border-color: #ea580c;
      background: #fff7ed;
      transform: translateY(-2px);
      box-shadow: 0 6px 16px rgba(234, 88, 12, 0.1);
    }
    .option-prefix {
      width: 28px;
      height: 28px;
      border-radius: 8px;
      background: #f1f5f9;
      color: #64748b;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      font-weight: 900;
      flex-shrink: 0;
    }
    .option-text {
      flex: 1;
      font-size: 18px;
      letter-spacing: -0.2px;
    }
    .option-feedback-icon {
      font-size: 20px;
      opacity: 0;
      transition: opacity 0.2s;
    }

    /* 选项状态 */
    .option-btn.correct {
      border-color: #059669 !important;
      background: #ecfdf5 !important;
      color: #047857 !important;
      box-shadow: 0 4px 16px rgba(5, 150, 105, 0.2) !important;
    }
    .option-btn.correct .option-prefix {
      background: #059669;
      color: white;
    }
    .option-btn.correct .option-feedback-icon {
      opacity: 1;
    }
    .option-btn.wrong {
      border-color: #e11d48 !important;
      background: #fff1f2 !important;
      color: #be123c !important;
      animation: shake 0.4s ease;
    }
    .option-btn.wrong .option-prefix {
      background: #e11d48;
      color: white;
    }
    .option-btn.wrong .option-feedback-icon {
      opacity: 1;
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-6px); }
      40%, 80% { transform: translateX(6px); }
    }

    /* 底部操作条 */
    .bottom-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }
    .next-btn {
      flex: 1;
      background: #ea580c;
      color: white;
      border: none;
      border-radius: 14px;
      padding: 14px;
      font-size: 16px;
      font-weight: 800;
      cursor: pointer;
      transition: all 0.2s;
      box-shadow: 0 4px 14px rgba(234, 88, 12, 0.3);
      display: none;
    }
    .next-btn:hover {
      background: #c2410c;
      transform: translateY(-2px);
    }

    /* 结算卡片 (Summary View) */
    .summary-card {
      display: none;
      background: white;
      border: 1px solid var(--border);
      border-radius: 22px;
      padding: 36px 24px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.06);
      text-align: center;
    }
    .summary-trophy { font-size: 54px; margin-bottom: 12px; }
    .summary-title { font-size: 26px; font-weight: 900; color: #0f172a; margin-bottom: 8px; }
    .summary-subtitle { font-size: 14px; color: #64748b; margin-bottom: 24px; }
    .summary-stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-bottom: 28px;
    }
    .stat-box {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 14px;
      padding: 14px;
    }
    .stat-box-val { font-size: 22px; font-weight: 900; color: #0f172a; }
    .stat-box-lbl { font-size: 12px; font-weight: 700; color: #64748b; margin-top: 2px; }

    .missed-list-box {
      text-align: left;
      background: #fff7ed;
      border: 1px solid #fed7aa;
      border-radius: 14px;
      padding: 16px;
      margin-bottom: 24px;
    }
    .missed-title {
      font-size: 13.5px;
      font-weight: 800;
      color: #c2410c;
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .missed-items {
      display: flex;
      flex-direction: column;
      gap: 8px;
      max-height: 200px;
      overflow-y: auto;
    }
    .missed-item-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13.5px;
      background: white;
      padding: 8px 12px;
      border-radius: 8px;
      border: 1px solid #fed7aa;
    }

    .restart-btn {
      width: 100%;
      background: #059669;
      color: white;
      border: none;
      border-radius: 14px;
      padding: 14px;
      font-size: 16px;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(5, 150, 105, 0.3);
      transition: all 0.2s;
    }
    .restart-btn:hover {
      background: #047857;
      transform: translateY(-2px);
    }
  </style>
</head>

        <span class="brand-text">Özbek Tili <span class="brand-sub">乌语学习平台</span></span>
      </a>
      <nav class="nav-menu">
        <a href="index.html" class="nav-tab">
          <span>🏠</span> <span>首页</span>
        </a>
        <a href="vocab.html" class="nav-tab">
          <span>📚</span> <span>核心词汇</span>
        </a>
        <a href="quiz.html" class="nav-tab active">

    </div>
  </header>

  <div class="container">

    <!-- 模式筛选标签 -->
    <div class="filter-row">
      <button class="pill-btn active" onclick="setRoundMode(10, this)">⚡️ 10 题速测</button>
      <button class="pill-btn" onclick="setRoundMode(20, this)">🎯 20 题挑战</button>
      <button class="pill-btn" onclick="setRoundMode(50, this)">🔥 50 题闯关</button>
      <button class="pill-btn" onclick="filterCategory('餐饮饮食', this)">🍽️ 美食餐饮</button>
      <button class="pill-btn" onclick="filterCategory('交通出行', this)">🚖 交通出行</button>
      <button class="pill-btn" onclick="filterCategory('文化艺术', this)">🏛️ 历史文化</button>
    </div>

    <!-- 顶部状态栏 -->
    <div class="quiz-dashboard" id="quizDashboard">
      <div class="dash-item">
        <span>进度</span>
        <span class="dash-val"><span id="qCurrent">1</span>/<span id="qTotal">10</span></span>
      </div>
      <div class="dash-item">
        <span>🔥 连击</span>
        <span class="dash-val val-streak" id="streakVal">0</span>
      </div>
      <div class="dash-item">
        <span>正确率</span>
        <span class="dash-val" id="accuracyVal">100%</span>
      </div>
      <div class="dash-item">
        <span>积分</span>
        <span class="dash-val" style="color: #059669;" id="scoreVal">0</span>
      </div>
    </div>

    <!-- 进度条 -->
    <div class="progress-track">
      <div class="progress-fill" id="progressFill"></div>
    </div>

    <!-- 主测验卡片 (Game Arena) -->
    <div id="gameArena">
      <div class="question-card" id="questionCard">
        <div class="question-badge" id="questionBadge">餐饮饮食 · A1</div>
        <div class="question-prompt">请根据中文意思选择正确的乌兹别克语词汇</div>
        <div class="question-chinese" id="targetChinese">火车站</div>
        <div class="question-hint" id="targetHint">[名词]</div>
      </div>

      <!-- 4 个选项 -->
      <div class="options-grid" id="optionsGrid">
        <!-- JS 动态渲染 -->
      </div>

      <div class="bottom-bar">
        <button class="next-btn" id="nextQuestionBtn" onclick="nextQuestion()">下一题 →</button>
      </div>
    </div>

    <!-- 结算卡片 (Summary) -->
    <div class="summary-card" id="summaryCard">
      <div class="summary-trophy" id="summaryTrophy">🏆</div>
      <div class="summary-title" id="summaryTitle">挑战完成！</div>
      <div class="summary-subtitle" id="summarySubtitle">太棒了，持续练习能快速建立语感反射！</div>

      <div class="summary-stats">
        <div class="stat-box">
          <div class="stat-box-val" id="sumScore">0</div>
          <div class="stat-box-lbl">总得分</div>
        </div>
        <div class="stat-box">
          <div class="stat-box-val" id="sumAccuracy">0%</div>
          <div class="stat-box-lbl">准确率</div>
        </div>
        <div class="stat-box">
          <div class="stat-box-val val-streak" id="sumMaxStreak">0</div>
          <div class="stat-box-lbl">最高连击</div>
        </div>
      </div>

      <!-- 错词回顾 -->
      <div class="missed-list-box" id="missedListBox" style="display: none;">
        <div class="missed-title">
          <span>❌ 本轮待强化生词</span>
          <span style="font-weight: 500; font-size: 11.5px; color: #ea580c;">(点击喇叭听真人发音)</span>
        </div>
        <div class="missed-items" id="missedItemsContainer"></div>
      </div>

      <button class="restart-btn" onclick="startNewRound()">🔄 再来一局挑战</button>
    </div>

  </div>

    let vocabPool = [...DEFAULT_VOCAB];
    let roundSize = 10;
    let roundQuestions = [];
    let currentQIdx = 0;
    let currentScore = 0;
    let currentStreak = 0;
    let maxStreak = 0;
    let correctCount = 0;
    let isAnswering = false;
    let missedWords = [];
    let activeAudio = null;

    function playAudio(no) {
      if (activeAudio) {
        activeAudio.pause();
        activeAudio.currentTime = 0;
      }
      if (no) {
        const audio = new Audio(`audio/${no}.mp3`);
        activeAudio = audio;
        audio.play().catch(e => console.warn(e));
      }
    }

    function shuffle(arr) {
      const a = [...arr];
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    }

    function filterCategory(cat, btn) {
      document.querySelectorAll('.filter-row .pill-btn').forEach(b => b.classList.remove('active'));
      if (btn) btn.classList.add('active');
      vocabPool = DEFAULT_VOCAB.filter(item => item.category === cat);
      if (vocabPool.length < 4) vocabPool = [...DEFAULT_VOCAB];
      startNewRound();
    }

    function setRoundMode(size, btn) {
      document.querySelectorAll('.filter-row .pill-btn').forEach(b => b.classList.remove('active'));
      if (btn) btn.classList.add('active');
      roundSize = size;
      vocabPool = [...DEFAULT_VOCAB];
      startNewRound();
    }

    function startNewRound() {
      document.getElementById('summaryCard').style.display = 'none';
      document.getElementById('gameArena').style.display = 'block';
      document.getElementById('quizDashboard').style.display = 'flex';

      currentQIdx = 0;
      currentScore = 0;
      currentStreak = 0;
      maxStreak = 0;
      correctCount = 0;
      missedWords = [];

      // 随机抽取 roundSize 个词作为题目
      const shuffled = shuffle(vocabPool);
      const actualSize = Math.min(roundSize, shuffled.length);
      roundQuestions = shuffled.slice(0, actualSize);

      document.getElementById('qTotal').textContent = actualSize;
      renderQuestion();
    }

    function renderQuestion() {
      if (currentQIdx >= roundQuestions.length) {
        finishRound();
        return;
      }

      isAnswering = true;
      document.getElementById('nextQuestionBtn').style.display = 'none';

      const cur = roundQuestions[currentQIdx];
      document.getElementById('qCurrent').textContent = currentQIdx + 1;
      document.getElementById('streakVal').textContent = currentStreak;
      document.getElementById('scoreVal').textContent = currentScore;

      const answeredTotal = currentQIdx;
      const acc = answeredTotal > 0 ? Math.round((correctCount / answeredTotal) * 100) : 100;
      document.getElementById('accuracyVal').textContent = acc + '%';

      const pct = Math.round((currentQIdx / roundQuestions.length) * 100);
      document.getElementById('progressFill').style.width = pct + '%';

      // 显示题目
      document.getElementById('targetChinese').textContent = cur.chinese;
      document.getElementById('questionBadge').textContent = `${cur.category || '核心词汇'} · ${cur.level || 'A1'}`;
      document.getElementById('targetHint').textContent = cur.type ? `[${cur.type}]` : '';

      // 生成 4 个选项：1 正确 + 3 干扰项
      const distractors = DEFAULT_VOCAB
        .filter(item => item.no !== cur.no)
        .sort(() => 0.5 - Math.random())
        .slice(0, 3);

      const options = shuffle([cur, ...distractors]);
      const grid = document.getElementById('optionsGrid');
      grid.innerHTML = '';

      const prefixes = ['A', 'B', 'C', 'D'];
      options.forEach((opt, idx) => {
        const btn = document.createElement('button');
        btn.className = 'option-btn';
        btn.innerHTML = `
          <div style="display:flex;align-items:center;gap:12px;flex:1;">
            <span class="option-prefix">${prefixes[idx]}</span>
            <span class="option-text">${opt.uzbek}</span>
          </div>
          <span class="option-feedback-icon" id="optIcon_${idx}">✓</span>
        `;
        btn.onclick = () => handleSelectOption(btn, opt, cur);
        grid.appendChild(btn);
      });
    }

    function handleSelectOption(clickedBtn, selectedWord, targetWord) {
      if (!isAnswering) return;
      isAnswering = false;

      const isCorrect = (selectedWord.no === targetWord.no);
      const allBtns = document.querySelectorAll('.option-btn');

      if (isCorrect) {
        clickedBtn.classList.add('correct');
        clickedBtn.querySelector('.option-feedback-icon').textContent = '✓';
        currentStreak++;
        if (currentStreak > maxStreak) maxStreak = currentStreak;
        currentScore += 10 + Math.min(20, currentStreak * 2);
        correctCount++;
        playAudio(targetWord.no);

        // 连对即时提示
        document.getElementById('streakVal').textContent = currentStreak;
        document.getElementById('scoreVal').textContent = currentScore;

        // 1 秒后自动平滑进入下一题
        setTimeout(() => {
          currentQIdx++;
          renderQuestion();
        }, 1100);
      } else {
        clickedBtn.classList.add('wrong');
        clickedBtn.querySelector('.option-feedback-icon').textContent = '✕';
        currentStreak = 0;
        document.getElementById('streakVal').textContent = '0';
        missedWords.push(targetWord);

        // 高亮正确选项并播放真人原声
        allBtns.forEach(btn => {
          if (btn.textContent.includes(targetWord.uzbek)) {
            btn.classList.add('correct');
            btn.querySelector('.option-feedback-icon').textContent = '✓';
          }
        });
        playAudio(targetWord.no);

        // 显示“下一题”按钮
        document.getElementById('nextQuestionBtn').style.display = 'block';
      }
    }

    function nextQuestion() {
      currentQIdx++;
      renderQuestion();
    }

    function finishRound() {
      document.getElementById('gameArena').style.display = 'none';
      document.getElementById('quizDashboard').style.display = 'none';
      document.getElementById('progressFill').style.width = '100%';

      const summary = document.getElementById('summaryCard');
      summary.style.display = 'block';

      const acc = Math.round((correctCount / roundQuestions.length) * 100);
      document.getElementById('sumScore').textContent = currentScore;
      document.getElementById('sumAccuracy').textContent = acc + '%';
      document.getElementById('sumMaxStreak').textContent = maxStreak;

      const trophy = document.getElementById('summaryTrophy');
      const title = document.getElementById('summaryTitle');
      const sub = document.getElementById('summarySubtitle');

      if (acc === 100) {
        trophy.textContent = '👑';
        title.textContent = '满分通关！太强了！';
        sub.textContent = '全部词汇精准掌握，词汇反射达到母语级！';
      } else if (acc >= 80) {
        trophy.textContent = '🌟';
        title.textContent = '成绩优异！表现亮眼！';
        sub.textContent = '大部分核心词汇已牢固建立记忆！';
      } else {
        trophy.textContent = '💪';
        title.textContent = '再接再厉，持之以恒！';
        sub.textContent = '强化错词复习，下一次一定能拿下高分！';
      }

      // 错词列表展示
      const missedBox = document.getElementById('missedListBox');
      const missedCont = document.getElementById('missedItemsContainer');
      if (missedWords.length > 0) {
        missedBox.style.display = 'block';
        missedCont.innerHTML = '';
        missedWords.forEach(w => {
          const row = document.createElement('div');
          row.className = 'missed-item-row';
          row.innerHTML = `
            <div>
              <strong style="color:#0f172a;font-size:15px;">${w.uzbek}</strong>
              <span style="color:#64748b;margin-left:8px;">${w.chinese}</span>
            </div>
            <button onclick="playAudio(${w.no})" style="background:#f1f5f9;border:1px solid #cbd5e1;border-radius:50%;width:32px;height:32px;cursor:pointer;">🔊</button>
          `;
          missedCont.appendChild(row);
        });
      } else {
        missedBox.style.display = 'none';
      }
    }

    // 键盘支持 (A, B, C, D 快速作答)
    document.addEventListener('keydown', function(e) {
      if (document.getElementById('gameArena').style.display === 'none') return;
      const key = e.key.toUpperCase();
      const map = { 'A': 0, '1': 0, 'B': 1, '2': 1, 'C': 2, '3': 2, 'D': 3, '4': 3 };
      if (key in map) {
        const btns = document.querySelectorAll('.option-btn');
        if (btns[map[key]] && isAnswering) {
          btns[map[key]].click();
        }
      } else if (e.code === 'Space' || e.code === 'Enter') {
        const nextBtn = document.getElementById('nextQuestionBtn');
        if (nextBtn && nextBtn.style.display === 'block') {
          e.preventDefault();
          nextQuestion();
        }
      }
    });

    // 初始化第一局
    startNewRound();
  </script>
