<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kundalik Suhbatlar · 乌兹别克语日常实用情景对话 (10大高频场景)</title>
  <style>
    :root {
      --primary: #059669;
      --primary-dark: #047857;
      --primary-light: #ecfdf5;
      --accent: #0284c7;
      --border: #e2e8f0;
      --text: #0f172a;
      --text-muted: #64748b;
      --bg: #f8fafc;
      --radius: 16px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
      padding-bottom: 120px;
      -webkit-font-smoothing: antialiased;
    }

        /* ================================================= */
    /* 🌟 全局置顶统一导航栏 (Global Navbar) */
    /* ================================================= */
    .app-header {
      position: sticky;
      top: 0;
      left: 0;
      right: 0;
      z-index: 1000;
      background: rgba(255, 255, 255, 0.96);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-bottom: 1px solid #e2e8f0;
      box-shadow: 0 2px 12px rgba(15, 23, 42, 0.04);
      margin-bottom: 24px;
    }
    .header-inner {
      max-width: 1200px;
      margin: 0 auto;
      padding: 10px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
    }
    .brand-logo {
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none !important;
      color: #0f172a !important;
      flex-shrink: 0;
    }
    .flag-icon { font-size: 24px; line-height: 1; }
    .brand-text {
      font-size: 17px;
      font-weight: 800;
      color: #0f172a;
      letter-spacing: -0.3px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .brand-sub {
      font-size: 12px;
      font-weight: 600;
      color: #059669;
      background: #ecfdf5;
      padding: 2px 8px;
      border-radius: 6px;
      border: 1px solid #a7f3d0;
    }
    .nav-menu {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .nav-tab {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 14px;
      border-radius: 12px;
      font-size: 13.5px;
      font-weight: 700;
      color: #475569 !important;
      text-decoration: none !important;
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
      white-space: nowrap;
      box-shadow: 0 1px 2px rgba(0,0,0,0.02);
    }
    .nav-tab:hover {
      background: #f1f5f9;
      color: #0f172a !important;
      border-color: #cbd5e1;
      transform: translateY(-1px);
    }
    .nav-tab.active {
      background: linear-gradient(135deg, #0f172a, #1e293b) !important;
      color: #ffffff !important;
      border-color: #0f172a;
      box-shadow: 0 4px 12px rgba(15, 23, 42, 0.18);
    }
    .tab-badge {
      font-size: 11px;
      font-weight: 800;
      padding: 1px 6px;
      border-radius: 10px;
      background: rgba(0, 0, 0, 0.08);
      color: inherit;
    }
    .nav-tab.active .tab-badge {
      background: rgba(255, 255, 255, 0.2);
      color: #ffffff;
    }

    @media (max-width: 768px) {
      .header-inner { padding: 8px 10px; flex-direction: column; align-items: stretch; gap: 8px; }
      .brand-logo { justify-content: center; }
      .brand-text { font-size: 15px; }
      .brand-sub { font-size: 11px; }
      .nav-menu { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; width: 100%; }
      .nav-tab { justify-content: center; padding: 7px 2px; font-size: 12px; }
      .tab-badge { display: none; }
    }

    .container {
      max-width: 1120px;
      margin: 0 auto;
      padding: 0 20px;
    }

    /* 页面标题 */
    .page-header {
      text-align: center;
      margin: 10px 0 24px;
    }
    .page-title {
      font-size: 28px;
      font-weight: 900;
      color: #0f172a;
      margin-bottom: 8px;
      letter-spacing: -0.5px;
    }
    .page-desc {
      font-size: 15px;
      color: #64748b;
      max-width: 680px;
      margin: 0 auto;
    }

    /* 分类筛选 */
    .filter-bar {
      display: flex;
      justify-content: center;
      gap: 8px;
      margin: 20px 0 28px;
      flex-wrap: wrap;
    }
    .filter-btn {
      padding: 7px 16px;
      border-radius: 20px;
      border: 1px solid var(--border);
      background: white;
      color: #475569;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
    }
    .filter-btn:hover { background: #f1f5f9; border-color: #cbd5e1; }
    .filter-btn.active { background: #0f172a; color: white; border-color: #0f172a; box-shadow: 0 2px 8px rgba(15,23,42,0.2); }

    /* 情景卡片墙 */
    .dialogue-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 20px;
    }
    .scenario-card {
      background: white;
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 22px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: all 0.25s ease;
      cursor: pointer;
      box-shadow: 0 2px 8px rgba(0,0,0,0.02);
      position: relative;
    }
    .scenario-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 12px 30px rgba(0,0,0,0.07);
      border-color: #cbd5e1;
    }
    .card-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 14px;
    }
    .card-icon-box {
      width: 52px;
      height: 52px;
      border-radius: 14px;
      background: #f1f5f9;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
    }
    .card-badges {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 4px;
    }
    .badge-level {
      font-size: 11px;
      font-weight: 800;
      padding: 3px 8px;
      border-radius: 8px;
      background: #ecfdf5;
      color: #047857;
      border: 1px solid #a7f3d0;
    }
    .badge-time {
      font-size: 11px;
      color: #94a3b8;
      font-weight: 600;
    }

    .card-title-uz {
      font-size: 18px;
      font-weight: 800;
      color: #0f172a;
      margin-bottom: 4px;
      line-height: 1.3;
    }
    .card-title-cn {
      font-size: 14.5px;
      font-weight: 700;
      color: #047857;
      margin-bottom: 10px;
    }
    .card-desc {
      font-size: 13.5px;
      color: #475569;
      line-height: 1.6;
      margin-bottom: 16px;
      flex: 1;
    }
    .card-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-top: 14px;
      border-top: 1px solid #f1f5f9;
      font-size: 12px;
      color: #64748b;
      font-weight: 600;
    }
    .card-btn {
      color: var(--primary-dark);
      font-weight: 800;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    /* ================================================= */
    /* 视图 2：对话详情学习区 (Dialogue Player View) */
    /* ================================================= */
    #dialogueView { display: none; }

    .sub-toolbar {
      position: sticky;
      top: 66px;
      z-index: 900;
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 10px 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 4px 16px rgba(0,0,0,0.03);
      margin-bottom: 20px;
    }
    .back-btn {
      background: #f1f5f9;
      border: 1px solid #cbd5e1;
      padding: 6px 14px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 700;
      color: #1e293b;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.15s;
    }
    .back-btn:hover { background: #e2e8f0; }

    .tool-group {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .tool-btn {
      background: white;
      border: 1px solid var(--border);
      padding: 6px 12px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 700;
      color: #475569;
      cursor: pointer;
      transition: all 0.2s;
    }
    .tool-btn:hover { background: #f8fafc; border-color: #cbd5e1; }
    .tool-btn.active { background: #0f172a; color: white; border-color: #0f172a; }

    /* 对话卡片容器 */
    .dialogue-sheet {
      background: white;
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 32px 36px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.02);
      margin-bottom: 40px;
    }
    @media (max-width: 640px) {
      .dialogue-sheet { padding: 20px 16px; }
    }

    .dialogue-header-box {
      border-bottom: 1px solid #f1f5f9;
      padding-bottom: 20px;
      margin-bottom: 24px;
    }
    .dialogue-uz-title {
      font-size: 24px;
      font-weight: 900;
      color: #0f172a;
      margin-bottom: 4px;
    }
    .dialogue-cn-title {
      font-size: 16px;
      font-weight: 700;
      color: var(--primary-dark);
      margin-bottom: 12px;
    }
    .dialogue-info-row {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 13px;
      color: #64748b;
      font-weight: 600;
      flex-wrap: wrap;
    }

    /* 对话行列表 */
    .dialogue-lines {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .chat-bubble-row {
      display: flex;
      flex-direction: column;
      padding: 14px 18px;
      border-radius: 16px;
      background: #f8fafc;
      border: 1px solid #f1f5f9;
      transition: all 0.2s;
      position: relative;
    }
    .chat-bubble-row:hover {
      background: #f1f5f9;
      border-color: #e2e8f0;
    }
    .chat-bubble-row.playing {
      background: #ecfdf5;
      border-color: #a7f3d0;
      box-shadow: 0 4px 16px rgba(5,150,105,0.12);
      transform: translateX(4px);
    }

    .bubble-speaker-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }
    .speaker-pill {
      font-size: 12px;
      font-weight: 800;
      padding: 2px 10px;
      border-radius: 8px;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }
    .speaker-a {
      background: #e0f2fe;
      color: #0369a1;
      border: 1px solid #bae6fd;
    }
    .speaker-b {
      background: #fef3c7;
      color: #b45309;
      border: 1px solid #fde68a;
    }

    .line-play-btn {
      background: white;
      border: 1px solid var(--border);
      width: 30px;
      height: 30px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      cursor: pointer;
      color: #475569;
      transition: all 0.2s;
    }
    .line-play-btn:hover {
      background: var(--primary);
      color: white;
      border-color: var(--primary);
      transform: scale(1.08);
    }
    .line-play-btn.playing {
      background: var(--primary);
      color: white;
      border-color: var(--primary);
    }

    .line-uzbek {
      font-size: 18px;
      font-weight: 700;
      color: #0f172a;
      line-height: 1.5;
      margin-bottom: 6px;
    }
    .line-chinese {
      font-size: 14.5px;
      color: #475569;
      line-height: 1.4;
      display: block;
      transition: all 0.2s;
    }
    .line-chinese.hidden { display: none; }

    /* 可点击单词 */
    .word-click {
      cursor: pointer;
      border-radius: 4px;
      padding: 1px 3px;
      margin: 0 1px;
      transition: all 0.15s;
      display: inline-block;
    }
    .word-click:hover {
      background: #fef08a;
      color: #854d0e;
    }
    .word-click.selected {
      background: #fde047;
      color: #713f12;
      font-weight: 800;
    }

    /* 底部悬浮控制台 */
    .floating-audio-bar {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      width: calc(100% - 40px);
      max-width: 680px;
      background: rgba(15, 23, 42, 0.95);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-radius: 20px;
      padding: 12px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      box-shadow: 0 16px 36px rgba(0,0,0,0.3);
      z-index: 1000;
      color: white;
    }
    .player-controls {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .player-btn {
      background: rgba(255,255,255,0.12);
      border: 1px solid rgba(255,255,255,0.15);
      color: white;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .player-btn:hover { background: rgba(255,255,255,0.25); transform: scale(1.06); }
    .player-btn-main {
      width: 48px;
      height: 48px;
      background: var(--primary);
      border-color: var(--primary);
      font-size: 20px;
    }
    .player-btn-main:hover {
      background: #10b981;
      transform: scale(1.08);
    }
    .player-status-text {
      font-size: 13px;
      font-weight: 700;
      color: #94a3b8;
    }
    .speed-btn {
      background: rgba(255,255,255,0.1);
      border: 1px solid rgba(255,255,255,0.15);
      color: white;
      padding: 5px 10px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 800;
      cursor: pointer;
    }

    /* 单词释义弹窗 */
    .word-bottom-sheet {
      position: fixed;
      bottom: -400px;
      left: 50%;
      transform: translateX(-50%);
      width: calc(100% - 32px);
      max-width: 500px;
      background: white;
      border: 1px solid var(--border);
      border-radius: 20px 20px 14px 14px;
      box-shadow: 0 -8px 30px rgba(0,0,0,0.15);
      padding: 20px 24px;
      z-index: 1200;
      transition: bottom 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .word-bottom-sheet.open {
      bottom: 90px;
    }
    .sheet-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }
    .sheet-word {
      font-size: 22px;
      font-weight: 900;
      color: #0f172a;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .sheet-speak-btn {
      background: #f1f5f9;
      border: 1px solid #cbd5e1;
      border-radius: 50%;
      width: 32px;
      height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 15px;
      transition: all 0.2s;
    }
    .sheet-speak-btn:hover { background: var(--primary); color: white; border-color: var(--primary); }
    .sheet-close-btn {
      background: transparent;
      border: none;
      font-size: 20px;
      color: #94a3b8;
      cursor: pointer;
    }
    .sheet-defs {
      font-size: 14.5px;
      color: #334155;
      font-weight: 600;
      margin-bottom: 16px;
      line-height: 1.5;
    }
    .sheet-actions {
      display: flex;
      gap: 10px;
    }
    .sheet-bookmark-btn {
      flex: 1;
      padding: 10px;
      border-radius: 12px;
      border: 1px solid var(--primary);
      background: var(--primary-light);
      color: var(--primary-dark);
      font-size: 13.5px;
      font-weight: 800;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: all 0.2s;
    }
    .sheet-bookmark-btn:hover {
      background: var(--primary);
      color: white;
    }
    .sheet-bookmark-btn.saved {
      background: #f1f5f9;
      border-color: #cbd5e1;
      color: #64748b;
    }

    /* 结语操作卡 */
    .finish-card {
      margin-top: 30px;
      padding: 24px;
      background: #f8fafc;
      border: 1px dashed #cbd5e1;
      border-radius: 16px;
      text-align: center;
    }
    .finish-title { font-size: 17px; font-weight: 800; color: #0f172a; margin-bottom: 6px; }
    .finish-desc { font-size: 13.5px; color: #64748b; margin-bottom: 16px; }
    .finish-btns { display: flex; justify-content: center; gap: 12px; flex-wrap: wrap; }
    .f-btn {
      padding: 8px 18px;
      border-radius: 12px;
      font-size: 13px;
      font-weight: 800;
      text-decoration: none;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s;
    }
    .f-btn-primary { background: #0f172a; color: white; border: 1px solid #0f172a; }
    .f-btn-secondary { background: white; color: #047857; border: 1px solid #a7f3d0; }
  </style>
</head>

  <!-- ============================================== -->
  <!-- 视图 1：情景卡片墙 (Catalog View) -->
  <!-- ============================================== -->
  <div class="container" id="catalogView">
    <div class="page-header">
      <h1 class="page-title">乌兹别克语日常实用情景对话</h1>
      <p class="page-desc">告别学了单词却不会开口的尴尬！精选 10 大中亚日常生活真实场景，100% 纯正母语原声发音，支持点击查词与发音。</p>
      
      <!-- 分类筛选标签 -->
      <div class="filter-bar">
        <button class="filter-btn active" onclick="filterCategory('ALL', this)">全部场景 (10)</button>
        <button class="filter-btn" onclick="filterCategory('出行交通', this)">🚖 出行交通 (3)</button>
        <button class="filter-btn" onclick="filterCategory('餐饮美食', this)">🍽️ 餐饮美食 (1)</button>
        <button class="filter-btn" onclick="filterCategory('购物消费', this)">🛒 购物消费 (1)</button>
        <button class="filter-btn" onclick="filterCategory('健康医疗', this)">💊 健康医疗 (1)</button>
        <button class="filter-btn" onclick="filterCategory('数码生活', this)">📱 办卡通信 (1)</button>
        <button class="filter-btn" onclick="filterCategory('社交人际', this)">🤝 社交礼仪 (3)</button>
      </div>
    </div>

    <!-- 10 大情景卡片网格 -->
    <div class="dialogue-grid" id="dialogueGrid">
      <!-- 由 JS 渲染 -->
    </div>
  </div>

  <!-- ============================================== -->
  <!-- 视图 2：对话详情学习区 (Dialogue View) -->
  <!-- ============================================== -->
  <div class="container" id="dialogueView">
    <div class="sub-toolbar">
      <button class="back-btn" onclick="showCatalog()">
        <span>← 返回情景列表</span>
      </button>
      <div class="tool-group">
        <button class="tool-btn" id="btnToggleTrans" onclick="toggleChineseTrans()">
          <span>译文：开</span>
        </button>
        <button class="tool-btn" onclick="changeFontSize(-1)">A-</button>
        <button class="tool-btn" onclick="changeFontSize(1)">A+</button>
      </div>
    </div>

    <!-- 对话详情卡片 -->
    <div class="dialogue-sheet">
      <div class="dialogue-header-box">
        <div class="dialogue-uz-title" id="dUzTitle"></div>
        <div class="dialogue-cn-title" id="dCnTitle"></div>
        <div class="dialogue-info-row">

  <script>
    const DIALOGUES_DATA = [{"id": "dialogue1", "titleUz": "Taksida: Manzil va joylashuv", "titleCn": "打车出行：告知司机位置与目的地", "level": "实用 A1", "category": "出行交通", "location": "📍 酒店门口至塔什干南站", "time": "⏱️ 约 2.5 分钟", "tag": "#打车必备", "desc": "告别打车沟通障碍！学会如何告诉司机自己在哪（大门前/路口）、去往何处、询问车费、靠边停车与结账。", "icon": "🚖", "sentences": [{"speaker": "Yo'lovchi (乘客)", "uzbek": "Assalomu alaykum! Bo'shmisiz?", "chinese": "您好！请问是空车吗？", "audio": "audio/dialogues/d1_1.mp3"}, {"speaker": "Haydovchi (司机)", "uzbek": "Va alaykum assalom! Ha, bo'shman. Qayerga borasiz?", "chinese": "您好！是的，空车。您去哪里？", "audio": "audio/dialogues/d1_2.mp3"}, {"speaker": "Yo'lovchi (乘客)", "uzbek": "Men Toshkent Janubiy temir yo'l vokzaliga borishim kerak.", "chinese": "我要去塔什干南火车站。", "audio": "audio/dialogues/d1_3.mp3"}, {"speaker": "Haydovchi (司机)", "uzbek": "Xo'p bo'ladi, o'tiring. Hozir qayerdasiz, mehmonxona oldidamizmi?", "chinese": "好的，请上车。您现在在哪，是在酒店门前吗？", "audio": "audio/dialogues/d1_4.mp3"}, {"speaker": "Yo'lovchi (乘客)", "uzbek": "Ha, men mehmonxonaning asosiy kirish eshigi oldida turibman.", "chinese": "是的，我正站在酒店的主大门前。", "audio": "audio/dialogues/d1_5.mp3"}, {"speaker": "Yo'lovchi (乘客)", "uzbek": "Vokzalgacha yo'lkira narxi qancha bo'ladi?", "chinese": "到火车站车费大约多少钱？", "audio": "audio/dialogues/d1_6.mp3"}, {"speaker": "Haydovchi (司机)", "uzbek": "O'ttiz ming so'm bo'ladi. Hisoblagich bo'yicha ketamiz.", "chinese": "三万索姆。我们按打表走。", "audio": "audio/dialogues/d1_7.mp3"}, {"speaker": "Yo'lovchi (乘客)", "uzbek": "Iltimos, biroz tezroq haydang, poyezdim 40 daqiqadan keyin jo'naydi.", "chinese": "请稍微开快一点，我的火车40分钟后发车。", "audio": "audio/dialogues/d1_8.mp3"}, {"speaker": "Haydovchi (司机)", "uzbek": "Xavotir olmang, yo'l ochiq, o'n besh daqiqada yetib boramiz.", "chinese": "别担心，路上通畅，我们十五分钟就能到。", "audio": "audio/dialogues/d1_9.mp3"}, {"speaker": "Yo'lovchi (乘客)", "uzbek": "Mana shu yerda, o'ng tomonda to'xtating, iltimos.", "chinese": "就在这里，请在右侧停一下。", "audio": "audio/dialogues/d1_10.mp3"}, {"speaker": "Yo'lovchi (乘客)", "uzbek": "Naqd pul bilan to'layman. Qaytimi kerak emas, rahmat!", "chinese": "我用现金付款。不用找零了，谢谢！", "audio": "audio/dialogues/d1_11.mp3"}, {"speaker": "Haydovchi (司机)", "uzbek": "Katta rahmat! Oq yo'l, yaxshi yetib oling!", "chinese": "非常感谢！祝您一路顺风，旅途平安！", "audio": "audio/dialogues/d1_12.mp3"}]}, {"id": "dialogue2", "titleUz": "Restoranda: Milliy taomlar", "titleCn": "餐厅点餐：品尝特色国菜与买单", "level": "实用 A1", "category": "餐饮美食", "location": "📍 传统乌兹别克餐厅", "time": "⏱️ 约 2.5 分钟", "tag": "#美食点餐", "desc": "轻松在餐厅点菜！看懂菜单、要手抓饭、烤羊肉串、热红茶、询问洗手间位置与结账买单。", "icon": "🍽️", "sentences": [{"speaker": "Mijoz (顾客)", "uzbek": "Kechirasiz, menyuni ko'rsatsangiz maylimi?", "chinese": "打扰一下，可以看一下菜单吗？", "audio": "audio/dialogues/d2_1.mp3"}, {"speaker": "Ofitsiant (服务员)", "uzbek": "Marhamat, mana menyu. Nima buyurtma qilasiz?", "chinese": "请看，这是菜单。您想点些什么？", "audio": "audio/dialogues/d2_2.mp3"}, {"speaker": "Mijoz (顾客)", "uzbek": "Bugungi toshkent oshi bormi? Juda issiq va mazali bo'lsin.", "chinese": "今天有塔什干手抓饭吗？要热气腾腾好吃的。", "audio": "audio/dialogues/d2_3.mp3"}, {"speaker": "Ofitsiant (服务员)", "uzbek": "Albatta, oshimiz hozirgina damlandi, juda lazzatli.", "chinese": "当然有，我们的抓饭刚焖出锅，非常可口。", "audio": "audio/dialogues/d2_4.mp3"}, {"speaker": "Mijoz (顾客)", "uzbek": "Bizga bitta osh, ikkita qo'y go'shti shashlik va bitta patir non bering.", "chinese": "给我们来一份抓饭、两串羊肉串和一个帕提尔烤馕。", "audio": "audio/dialogues/d2_5.mp3"}, {"speaker": "Ofitsiant (服务员)", "uzbek": "Ichimlikka nima ichasizlar? Ko'k choymi yoki qora choymi?", "chinese": "饮品喝点什么？绿茶还是红茶？", "audio": "audio/dialogues/d2_6.mp3"}, {"speaker": "Mijoz (顾客)", "uzbek": "Bitta choynakda issiq ko'k choy va limon bering.", "chinese": "来一壶热绿茶，加几片柠檬。", "audio": "audio/dialogues/d2_7.mp3"}, {"speaker": "Mijoz (顾客)", "uzbek": "Kechirasiz, hojatxona qayerda joylashgan?", "chinese": "请问一下，洗手间在哪个方向？", "audio": "audio/dialogues/d2_8.mp3"}, {"speaker": "Ofitsiant (服务员)", "uzbek": "To'g'riga borib, chap tomonga buriling.", "chinese": "往前直走，然后往左拐就是。", "audio": "audio/dialogues/d2_9.mp3"}, {"speaker": "Mijoz (顾客)", "uzbek": "Hisobni olib kelsangiz, iltimos. Karta orqali to'lasam bo'ladimi?", "chinese": "请拿账单来结账。可以刷卡付款吗？", "audio": "audio/dialogues/d2_10.mp3"}, {"speaker": "Ofitsiant (服务员)", "uzbek": "Ha, albatta, terminalimiz ishlayapti.", "chinese": "可以的，我们的刷卡终端正常运作。", "audio": "audio/dialogues/d2_11.mp3"}]}, {"id": "dialogue3", "titleUz": "Bozorda: Meva va savdolashish", "titleCn": "巴扎集市：买水果与讨价还价", "level": "实用 A1", "category": "购物消费", "location": "📍 琼苏集市水果摊", "time": "⏱️ 约 2.5 分钟", "tag": "#巴扎砍价", "desc": "体验中亚巴扎的热闹砍价文化！问价格、品尝水果甜度、请求打折、按公斤称重与支付。", "icon": "🛒", "sentences": [{"speaker": "Xaridor (买家)", "uzbek": "Assalomu alaykum aka! Bu anorlarning bir kilosi qancha turadi?", "chinese": "你好老哥！这些石榴一公斤多少钱？", "audio": "audio/dialogues/d3_1.mp3"}, {"speaker": "Sotuvchi (卖家)", "uzbek": "Va alaykum assalom! Kilosi yigirma besh ming so'm. Juda shirin!", "chinese": "你好！每公斤两万五千索姆。特别甜！", "audio": "audio/dialogues/d3_2.mp3"}, {"speaker": "Xaridor (买家)", "uzbek": "Bir donasini tatib ko'rsam maylimi?", "chinese": "我可以尝一颗试试吗？", "audio": "audio/dialogues/d3_3.mp3"}, {"speaker": "Sotuvchi (卖家)", "uzbek": "Marhamat, bemalol totib ko'ring, asaldek shirin!", "chinese": "请随意品尝，像蜂蜜一样甜！", "audio": "audio/dialogues/d3_4.mp3"}, {"speaker": "Xaridor (买家)", "uzbek": "Rostdan ham shirin ekan. Lekin narxi biroz qimmat. Arzonroq qilib bering.", "chinese": "确实挺甜的。不过价格稍微有点贵，能便宜点吗？", "audio": "audio/dialogues/d3_5.mp3"}, {"speaker": "Sotuvchi (卖家)", "uzbek": "Agar uch kilo olsangiz, yigirma mingdan hisoblab beraman.", "chinese": "如果您买三公斤，我按两万索姆给您算。", "audio": "audio/dialogues/d3_6.mp3"}, {"speaker": "Xaridor (买家)", "uzbek": "Yaxshi, kelishdik! Menga uch kilo eng yaxshilaridan tortib bering.", "chinese": "行，成交！请给我称三公斤最好的石榴。", "audio": "audio/dialogues/d3_7.mp3"}, {"speaker": "Sotuvchi (卖家)", "uzbek": "Mana, roppa-rosa uch kilo bo'ldi. Yana nima olasiz?", "chinese": "给您，正好整整三公斤。还想再要点别的吗？", "audio": "audio/dialogues/d3_8.mp3"}, {"speaker": "Xaridor (买家)", "uzbek": "Rahmat, hozircha yetarli. Jami oltmish ming so'm bo'ldimi?", "chinese": "谢谢，目前够了。总共是六万索姆对吗？", "audio": "audio/dialogues/d3_9.mp3"}, {"speaker": "Sotuvchi (卖家)", "uzbek": "Ha, shunday. Xaridingiz uchun rahmat, yana keling!", "chinese": "对，是的。感谢您的光顾，欢迎下次再来！", "audio": "audio/dialogues/d3_10.mp3"}]}, {"id": "dialogue4", "titleUz": "Ko'chada: Yo'l so'rash", "titleCn": "街头问路：寻找地铁站与方向指引", "level": "实用 A1", "category": "日常出行", "location": "📍 塔什干城市街道", "time": "⏱️ 约 2 分钟", "tag": "#问路求助", "desc": "在异国街头不再迷茫！询问最近的地铁站在哪里、直走还是转弯、步行多久、附近标志性建筑。", "icon": "🗺️", "sentences": [{"speaker": "Sayyoh (游客)", "uzbek": "Kechirasiz, sizdan bir narsa so'rasam maylimi?", "chinese": "打扰一下，我可以向您请教个事吗？", "audio": "audio/dialogues/d4_1.mp3"}, {"speaker": "Yo'lovchi (路人)", "uzbek": "Ha, bemalol, qanday yordam bera olaman?", "chinese": "可以的请讲，我能帮您什么？", "audio": "audio/dialogues/d4_2.mp3"}, {"speaker": "Sayyoh (游客)", "uzbek": "Eng yaqin metro bekati qayerda joylashgan?", "chinese": "请问距离最近的地铁站在哪里？", "audio": "audio/dialogues/d4_3.mp3"}, {"speaker": "Yo'lovchi (路人)", "uzbek": "Bu ko'chadan to'g'riga qarab yuring.", "chinese": "顺着这条街一直往前走。", "audio": "audio/dialogues/d4_4.mp3"}, {"speaker": "Yo'lovchi (路人)", "uzbek": "Svetofordan o'tgach, o'ng tomonga buriling.", "chinese": "过了红绿灯路口之后，往右转。", "audio": "audio/dialogues/d4_5.mp3"}, {"speaker": "Sayyoh (游客)", "uzbek": "Bu yerdan piyoda borsa, necha daqiqa vaqt ketadi?", "chinese": "从这里步行过去大概需要几分钟时间？", "audio": "audio/dialogues/d4_6.mp3"}, {"speaker": "Yo'lovchi (路人)", "uzbek": "Taxminan besh daqiqada yetib olasiz, juda yaqin.", "chinese": "大概五分钟就能走到，非常近。", "audio": "audio/dialogues/d4_7.mp3"}, {"speaker": "Sayyoh (游客)", "uzbek": "Metro bekatining nomi nima?", "chinese": "那个地铁站名叫什么？", "audio": "audio/dialogues/d4_8.mp3"}, {"speaker": "Yo'lovchi (路人)", "uzbek": "U 'Amir Temur xiyoboni' bekati deb ataladi.", "chinese": "它叫‘帖木儿林荫大道’站。", "audio": "audio/dialogues/d4_9.mp3"}, {"speaker": "Sayyoh (游客)", "uzbek": "Katta rahmat sizga, kuningiz xayrli o'tsin!", "chinese": "非常感谢您，祝您今天愉快！", "audio": "audio/dialogues/d4_10.mp3"}]}, {"id": "dialogue5", "titleUz": "Mehmonxonada: Xona olish", "titleCn": "酒店入住：办理登记与前台服务", "level": "实用 A1", "category": "住宿旅行", "location": "📍 酒店接待前台", "time": "⏱️ 约 2.5 分钟", "tag": "#酒店入住", "desc": "顺利入住酒店！出示护照登记、获取房卡、询问WiFi密码、早餐时间与退房流程。", "icon": "🏨", "sentences": [{"speaker": "Mehmon (房客)", "uzbek": "Xayrli kun! Men bu yerda xona band qilgan edim.", "chinese": "中午好！我之前在这里预订了房间。", "audio": "audio/dialogues/d5_1.mp3"}, {"speaker": "Administrator (前台)", "uzbek": "Xayrli kun! Ism-familiyangizni aytsangiz, iltimos.", "chinese": "中午好！请告诉我您的姓名。", "audio": "audio/dialogues/d5_2.mp3"}, {"speaker": "Mehmon (房客)", "uzbek": "Mening ismim Natan. Mana mening pasportim.", "chinese": "我叫纳坦。这是我的护照。", "audio": "audio/dialogues/d5_3.mp3"}, {"speaker": "Administrator (前台)", "uzbek": "Rahmat. Ha, uch kechaga bitta standart xona band qilingan.", "chinese": "谢谢。是的，查到了您预订了三晚的标准间。", "audio": "audio/dialogues/d5_4.mp3"}, {"speaker": "Administrator (前台)", "uzbek": "Mana xonangizning elektron kaliti. Siz to'rtinchi qavatdagi 408-xonadasiz.", "chinese": "这是您房间的门卡。您住在四楼408房。", "audio": "audio/dialogues/d5_5.mp3"}, {"speaker": "Mehmon (房客)", "uzbek": "Mehmonxonada bepul Wi-Fi bormi? Paroli qanaqa?", "chinese": "酒店有免费WiFi吗？密码是多少？", "audio": "audio/dialogues/d5_6.mp3"}, {"speaker": "Administrator (前台)", "uzbek": "Wi-Fi butun binoda ishlaydi. Parol kalit g'ilofida yozilgan.", "chinese": "全楼都有WiFi覆盖。密码印在房卡套背面。", "audio": "audio/dialogues/d5_7.mp3"}, {"speaker": "Mehmon (房客)", "uzbek": "Ertalab nonushta soat nechada boshlanadi?", "chinese": "早晨早餐几点开始供应？", "audio": "audio/dialogues/d5_8.mp3"}, {"speaker": "Administrator (前台)", "uzbek": "Nonushta birinchi qavatdagi restoranda yettidan o'ngacha bo'ladi.", "chinese": "早餐在一楼餐厅，早上七点到十点供应。", "audio": "audio/dialogues/d5_9.mp3"}, {"speaker": "Mehmon (房客)", "uzbek": "Tushunarli, yordamingiz uchun rahmat!", "chinese": "明白了，感谢您的帮助！", "audio": "audio/dialogues/d5_10.mp3"}]}, {"id": "dialogue6", "titleUz": "Dorixonada: Dori sotib olish", "titleCn": "药店买药：症状说明与用药咨询", "level": "实用 A2", "category": "健康医疗", "location": "📍 社区药店 (Dorixona)", "time": "⏱️ 约 2.5 分钟", "tag": "#药店求药", "desc": "身体不适时的自救沟通！说明头痛发烧、感冒胃痛等症状，询问服用频次、饭前还是饭后服药。", "icon": "💊", "sentences": [{"speaker": "Bemor (顾客)", "uzbek": "Assalomu alaykum! Menga yordamingiz kerak edi.", "chinese": "您好！我需要您的帮助。", "audio": "audio/dialogues/d6_1.mp3"}, {"speaker": "Farmatsevt (药剂师)", "uzbek": "Va alaykum assalom! Qayeringiz og'riyapti?", "chinese": "您好！您哪里不舒服？", "audio": "audio/dialogues/d6_2.mp3"}, {"speaker": "Bemor (顾客)", "uzbek": "Boshim qattiq og'riyapti va biroz shamollaganman, tomog'im ham achishyapti.", "chinese": "我头痛得很厉害，有点着凉感冒，喉咙也疼。", "audio": "audio/dialogues/d6_3.mp3"}, {"speaker": "Farmatsevt (药剂师)", "uzbek": "Haroratingiz bormi? Isitma chiqdimi?", "chinese": "您量体温了吗？有发烧吗？", "audio": "audio/dialogues/d6_4.mp3"}, {"speaker": "Bemor (顾客)", "uzbek": "Ha, ertalab o'ttiz yetti yarim daraja edi.", "chinese": "有的，早上量了三十七度半。", "audio": "audio/dialogues/d6_5.mp3"}, {"speaker": "Farmatsevt (药剂师)", "uzbek": "Mana bu tabletka bosh og'rig'i va haroratni tezda tushiradi.", "chinese": "这款药片可以快速缓解头痛和退烧。", "audio": "audio/dialogues/d6_6.mp3"}, {"speaker": "Bemor (顾客)", "uzbek": "Bu dorini kuniga necha marta ichish kerak?", "chinese": "这药一天需要吃几次？", "audio": "audio/dialogues/d6_7.mp3"}, {"speaker": "Farmatsevt (药剂师)", "uzbek": "Kuniga ikki marta, ovqatdan keyin bittadan ichasiz.", "chinese": "一天两次，饭后各吃一片。", "audio": "audio/dialogues/d6_8.mp3"}, {"speaker": "Bemor (顾客)", "uzbek": "Tushundim. Ko'p suv ichishim kerakmi?", "chinese": "明白了。需要多喝水吗？", "audio": "audio/dialogues/d6_9.mp3"}, {"speaker": "Farmatsevt (药剂师)", "uzbek": "Albatta, iliq choy va qaynatilgan suv ko'proq iching. Tezroq sog'ayib keting!", "chinese": "当然，多喝温热的茶水和开水。祝您早日康复！", "audio": "audio/dialogues/d6_10.mp3"}]}, {"id": "dialogue7", "titleUz": "Aloqa bo'limida: SIM-karta", "titleCn": "办手机卡：选择网络流量与充值", "level": "实用 A2", "category": "数码生活", "location": "📍 移动运营商营业厅", "time": "⏱️ 约 2.5 分钟", "tag": "#电话卡办理", "desc": "落地乌兹别克斯坦第一件事！购买本地电话卡、选大流量套餐、出示护照登记与查话费余额。", "icon": "📱", "sentences": [{"speaker": "Mijoz (顾客)", "uzbek": "Assalomu alaykum! Men yangi SIM-karta sotib olmoqchiman.", "chinese": "您好！我想买一张新的本地手机SIM卡。", "audio": "audio/dialogues/d7_1.mp3"}, {"speaker": "Xodim (营业员)", "uzbek": "Va alaykum assalom! Sayyohlar uchun maxsus internet tariflarimiz bor.", "chinese": "您好！我们有专门面向游客的上网流量套餐。", "audio": "audio/dialogues/d7_2.mp3"}, {"speaker": "Mijoz (顾客)", "uzbek": "Menga internet trafiki ko'proq kerak. Qaysi tarif yaxshi?", "chinese": "我需要比较多的上网流量。哪个套餐比较合适？", "audio": "audio/dialogues/d7_3.mp3"}, {"speaker": "Xodim (营业员)", "uzbek": "Bu tarifda bir oyga o'ttiz gigabayt internet va cheksiz qo'ng'iroqlar mavjud.", "chinese": "这个套餐每月含三十个G流量和无限本地通话。", "audio": "audio/dialogues/d7_4.mp3"}, {"speaker": "Mijoz (顾客)", "uzbek": "Uning oylik to'lovi qancha bo'ladi?", "chinese": "它的月租费用是多少？", "audio": "audio/dialogues/d7_5.mp3"}, {"speaker": "Xodim (营业员)", "uzbek": "Oyiga ellik ming so'm. Rasmiylashtirish uchun xorijiy pasportingiz kerak.", "chinese": "每月五万索姆。办理实名登记需要您的外国护照。", "audio": "audio/dialogues/d7_6.mp3"}, {"speaker": "Mijoz (顾客)", "uzbek": "Mana mening pasportim. SIM-karta hoziroq faollashadimi?", "chinese": "这是我的护照。手机卡现在立刻就能激活吗？", "audio": "audio/dialogues/d7_7.mp3"}, {"speaker": "Xodim (营业员)", "uzbek": "Ha, besh daqiqada faollashadi. Telefoningizga o'rnatib beraman.", "chinese": "是的，五分钟内激活。我帮您装进手机里。", "audio": "audio/dialogues/d7_8.mp3"}, {"speaker": "Mijoz (顾客)", "uzbek": "Balansni qanday kod orqali tekshirish mumkin?", "chinese": "通过什么代码可以查询话费余额？", "audio": "audio/dialogues/d7_9.mp3"}, {"speaker": "Xodim (营业员)", "uzbek": "Yulduzcha 100 panjara tering, ekranda hisobingiz chiqadi.", "chinese": "拨打 *100# ，屏幕上就会显示您的账户余额。", "audio": "audio/dialogues/d7_10.mp3"}]}, {"id": "dialogue8", "titleUz": "Yangi tanishuv va suhbat", "titleCn": "认识新朋友：自我介绍与交换联系方式", "level": "实用 A1", "category": "社交人际", "location": "📍 咖啡馆或学术会议", "time": "⏱️ 约 2.5 分钟", "tag": "#破冰交友", "desc": "地道结交乌兹别克朋友！打招呼、询问来自哪里、说明在中国的工作生活、交换 Telegram 账号。", "icon": "🤝", "sentences": [{"speaker": "Dilshod", "uzbek": "Salom! Men sizni avval ko'rmaganman. Yangi keldingizmi?", "chinese": "你好！我以前没见过你，是刚来的吗？", "audio": "audio/dialogues/d8_1.mp3"}, {"speaker": "Natan", "uzbek": "Salom! Ha, men kecha Toshkentga birinchi marta keldim.", "chinese": "你好！是的，我昨天刚第一次来到塔什干。", "audio": "audio/dialogues/d8_2.mp3"}, {"speaker": "Dilshod", "uzbek": "Juda ajoyib! Mening ismim Dilshod. Sizning ismingiz nima?", "chinese": "太棒了！我叫迪尔绍德。你叫什么名字？", "audio": "audio/dialogues/d8_3.mp3"}, {"speaker": "Natan", "uzbek": "Mening ismim Natan. Siz bilan tanishganimdan juda xursandman!", "chinese": "我叫纳坦。很高兴认识你！", "audio": "audio/dialogues/d8_4.mp3"}, {"speaker": "Dilshod", "uzbek": "Men ham xursandman! Qayerdan kelgansiz?", "chinese": "我也很高兴！你来自哪里？", "audio": "audio/dialogues/d8_5.mp3"}, {"speaker": "Natan", "uzbek": "Men Xitoydan kelganman. O'zbek tilini o'rganyapman.", "chinese": "我来自中国。我正在学习乌兹别克语。", "audio": "audio/dialogues/d8_6.mp3"}, {"speaker": "Dilshod", "uzbek": "Qoyil! O'zbekcha juda yaxshi gapirar ekansiz!", "chinese": "太赞了！你的乌兹别克语讲得真不错！", "audio": "audio/dialogues/d8_7.mp3"}, {"speaker": "Natan", "uzbek": "Rahmat! Hali ko'p mashq qilishim kerak.", "chinese": "谢谢！我还得多加练习呢。", "audio": "audio/dialogues/d8_8.mp3"}, {"speaker": "Dilshod", "uzbek": "Telegram raqamingiz bormi? Bog'lanib turamiz.", "chinese": "你有 Telegram 账号吗？我们常联络。", "audio": "audio/dialogues/d8_9.mp3"}, {"speaker": "Natan", "uzbek": "Ha, albatta! Mana mening raqamim, yozib oling.", "chinese": "当然有！这是我的号码，你记一下。", "audio": "audio/dialogues/d8_10.mp3"}]}, {"id": "dialogue9", "titleUz": "Vokzalda: Poyezdga chiqish", "titleCn": "火车站乘车：问询站台与检票安检", "level": "实用 A2", "category": "城际旅行", "location": "📍 撒马尔罕方向候车大厅", "time": "⏱️ 约 2.5 分钟", "tag": "#车站乘车", "desc": "顺利乘高铁畅游丝路！寻找进站安检口、问询前往撒马尔罕列车站台、车厢号码与发车时刻。", "icon": "🚅", "sentences": [{"speaker": "Yo'lovchi (旅客)", "uzbek": "Assalomu alaykum! Chipta nazorati qayerdan o'tadi?", "chinese": "您好！请问检票入口从哪里进？", "audio": "audio/dialogues/d9_1.mp3"}, {"speaker": "Navbatchi (值班员)", "uzbek": "Va alaykum assalom! Katta eshikdan to'g'ri kiring, yukingizni tekshiruvga qo'ying.", "chinese": "您好！从大门直接进去，把您的行李放到安检机上。", "audio": "audio/dialogues/d9_2.mp3"}, {"speaker": "Yo'lovchi (旅客)", "uzbek": "Samarqandga ketadigan 'Afrosiyob' poyezdi qaysi yo'ldan jo'naydi?", "chinese": "去撒马尔罕的‘阿夫罗西约布’号列车在几号站台发车？", "audio": "audio/dialogues/d9_3.mp3"}, {"speaker": "Navbatchi (值班员)", "uzbek": "Birinchi yo'ldan, ikkinchi platformada turibdi.", "chinese": "在一道，停在第二站台。", "audio": "audio/dialogues/d9_4.mp3"}, {"speaker": "Yo'lovchi (旅客)", "uzbek": "Poyezd jo'nashiga necha daqiqa qoldi?", "chinese": "距离列车发车还有多少分钟？", "audio": "audio/dialogues/d9_5.mp3"}, {"speaker": "Navbatchi (值班员)", "uzbek": "Yigirma daqiqa qoldi, poyezdga chiqish boshlangan.", "chinese": "还剩二十分钟，已经开始登车了。", "audio": "audio/dialogues/d9_6.mp3"}, {"speaker": "Yo'lovchi (旅客)", "uzbek": "Mening vagonim beshinchi vagon. U poyezdning boshidami?", "chinese": "我的车厢是五号车厢。它在列车车头方向吗？", "audio": "audio/dialogues/d9_7.mp3"}, {"speaker": "Navbatchi (值班员)", "uzbek": "Ha, poyezdning oldingi tomonida joylashgan.", "chinese": "是的，位于列车的前半部分。", "audio": "audio/dialogues/d9_8.mp3"}, {"speaker": "Yo'lovchi (旅客)", "uzbek": "Katta rahmat! Yordamingiz uchun minnatdorman.", "chinese": "非常感谢！多谢您的指引。", "audio": "audio/dialogues/d9_9.mp3"}, {"speaker": "Navbatchi (值班员)", "uzbek": "Arzimaydi, sayohatingiz maroqli o'tsin!", "chinese": "不客气，祝您旅途愉快！", "audio": "audio/dialogues/d9_10.mp3"}]}, {"id": "dialogue10", "titleUz": "Mehmondorchilik: Hovlida", "titleCn": "拜访做客：做客传统老院与品茶礼节", "level": "实用 A2", "category": "风俗礼仪", "location": "📍 乌兹别克家庭传统庭院", "time": "⏱️ 约 2.5 分钟", "tag": "#做客礼节", "desc": "体验乌兹别克最温暖的好客礼仪！进门礼节、在长榻入座、赞美茶点丰盛、礼貌致谢告辞。", "icon": "☕", "sentences": [{"speaker": "Mezbon (主人)", "uzbek": "Assalomu alaykum, aziz mehmon! Xonadonimizga xush kelibsiz!", "chinese": "您好，尊贵的客人！欢迎光临寒舍！", "audio": "audio/dialogues/d10_1.mp3"}, {"speaker": "Mehmon (客人)", "uzbek": "Va alaykum assalom! Taklifingiz uchun katta rahmat, uyingiz obod bo'lsin!", "chinese": "您好！非常感谢您的邀请，祝您家庭美满兴旺！", "audio": "audio/dialogues/d10_2.mp3"}, {"speaker": "Mezbon (主人)", "uzbek": "Poyabzalingizni bu yerda yechib, ichkariga marhamat qiling.", "chinese": "请把鞋子脱在这里，快请进屋。", "audio": "audio/dialogues/d10_3.mp3"}, {"speaker": "Mezbon (主人)", "uzbek": "Hovlidagi so'riga, to'rga o'tiring, bu yerda havo salqin.", "chinese": "请到庭院的木榻上座就座，这里微风凉爽。", "audio": "audio/dialogues/d10_4.mp3"}, {"speaker": "Mehmon (客人)", "uzbek": "Rahmat! Dasturxoningiz juda to'kin va chiroyli bezatilgan ekan.", "chinese": "谢谢！您的餐席真是太丰盛美观了。", "audio": "audio/dialogues/d10_5.mp3"}, {"speaker": "Mezbon (主人)", "uzbek": "Issiq non va mevalardan oling. Hozir yangi damlangan choy quyamiz.", "chinese": "请吃热腾腾的馕和水果。马上给您倒刚沏好的茶。", "audio": "audio/dialogues/d10_6.mp3"}, {"speaker": "Mehmon (客人)", "uzbek": "Choy juda xushbo'y va mazali ekan, qo'llaringiz dard ko'rmasin!", "chinese": "茶水香气扑鼻、非常好喝，辛苦您了！", "audio": "audio/dialogues/d10_7.mp3"}, {"speaker": "Mezbon (主人)", "uzbek": "Oling, yana iching! Mehmondo'stlik bizning qadimiy odatimiz.", "chinese": "别客气，再多喝点！热情好客是我们悠久的传统。", "audio": "audio/dialogues/d10_8.mp3"}, {"speaker": "Mehmon (客人)", "uzbek": "Cheksiz minnatdorman, mehmondo'stligingiz qalbimda qoladi.", "chinese": "不胜感激，您一家的热情好客深深留在我的心中。", "audio": "audio/dialogues/d10_9.mp3"}, {"speaker": "Mezbon (主人)", "uzbek": "Doim xush ko'rdik, yana bemalol kelib turing!", "chinese": "随时欢迎您，以后经常来玩！", "audio": "audio/dialogues/d10_10.mp3"}]}];

      if (!d) return;

      document.getElementById('dUzTitle').textContent = d.titleUz;
      document.getElementById('dCnTitle').textContent = d.titleCn;
      document.getElementById('dLocation').textContent = d.location;
      document.getElementById('dLineCount').textContent = `共 ${d.sentences.length} 句会话`;

      const container = document.getElementById('dLinesContainer');
      container.innerHTML = '';

      d.sentences.forEach((line, lIdx) => {
        const row = document.createElement('div');
        row.className = 'chat-bubble-row';
        row.id = `lineRow_${lIdx}`;

        const isSpeakerA = lIdx % 2 === 0;
        const pillClass = isSpeakerA ? 'speaker-pill speaker-a' : 'speaker-pill speaker-b';

        row.innerHTML = `
          <div class="bubble-speaker-bar">
            <span class="${pillClass}">${line.speaker || '说话人'}</span>
            <button class="line-play-btn" onclick="playSingleLine(event, ${lIdx})" title="播放本句">▶</button>
          </div>
          <div class="line-uzbek">${formatWordsHTML(line.uzbek, lIdx)}</div>
          <div class="line-chinese ${showChinese ? '' : 'hidden'}">${line.chinese}</div>
        `;
        container.appendChild(row);
      });

      highlightLine(currentLineIdx);
    }

    function formatWordsHTML(text, lineIdx) {
      return text.replace(/([a-zA-Z'‘’`ʻ]+)/g, function(match) {
        let prefix = '', suffix = '', word = match;
        while (word.startsWith("'") || word.startsWith("‘") || word.startsWith("’") || word.startsWith("`")) {
          prefix += word[0]; word = word.slice(1);
        }
        while (word.endsWith("'") || word.endsWith("‘") || word.endsWith("’") || word.endsWith("`")) {
          suffix = word.slice(-1) + suffix; word = word.slice(0, -1);
        }
        if (!word) return match;
        const safe = word.replace(/'/g, "\'");
        return `${prefix}<span class="word-click" onclick="inspectWord(event, '${safe}', ${lineIdx})">${word}</span>${suffix}`;
      });
    }

    // 点词查义
    function inspectWord(e, rawWord, lineIdx) {
      if (e) e.stopPropagation();
      const clean = rawWord.replace(/[^A-Za-z'‘’`ʻ]/g, '').toLowerCase().replace(/['‘’`ʻ]/g, "_");

      document.querySelectorAll('.word-click.selected').forEach(el => el.classList.remove('selected'));
      if (e && e.target) e.target.classList.add('selected');

      let info = LEMMA_MAP[clean];
      if (!info) {
        info = {
          lemma: rawWord,
          level: "A1",
          type: "日常情景会话",
          defs: [rawWord]
        };
      }

      activeInspectWord = { ...info, cleanKey: clean, lineIdx };

      document.getElementById('sheetWordText').textContent = info.lemma;
      document.getElementById('sheetDefText').textContent = (info.defs || []).join('；');

      updateBookmarkUI(info.lemma);
      document.getElementById('wordBottomSheet').classList.add('open');
    }

    function closeSheet() {
      document.getElementById('wordBottomSheet').classList.remove('open');
      document.querySelectorAll('.word-click.selected').forEach(el => el.classList.remove('selected'));
    }

    function speakSheetWord() {
      if (!activeInspectWord) return;
      const key = activeInspectWord.cleanKey;
      const audio = new Audio(`audio/words/${key}.mp3`);
      audio.onerror = () => {
        if ('speechSynthesis' in window) {
          const u = new SpeechSynthesisUtterance(activeInspectWord.lemma);
          u.lang = 'uz-UZ';
          window.speechSynthesis.speak(u);
        }
      };
      audio.play().catch(() => {});
    }

    function updateBookmarkUI(lemma) {
      const btn = document.getElementById('sheetBookmarkBtn');
      const saved = getSavedVocab();
      const exists = saved.some(i => i.uzbek && i.uzbek.toLowerCase() === lemma.toLowerCase());
      if (exists) {
        btn.classList.add('saved');
        document.getElementById('sheetBmText').textContent = '已在生词库中';
      } else {
        btn.classList.remove('saved');
        document.getElementById('sheetBmText').textContent = '收藏生词到核心词汇馆';
      }
    }

    function toggleBookmarkSheetWord() {
      if (!activeInspectWord) return;
      const lemma = activeInspectWord.lemma;
      const saved = getSavedVocab();
      const exists = saved.some(i => i.uzbek && i.uzbek.toLowerCase() === lemma.toLowerCase());
      if (exists) {
        alert(`“${lemma}” 已经在您的核心词汇库中了！可在【核心词汇馆】复习。`);
        return;
      }
      const newItem = {
        no: saved.length + 1,
        uzbek: lemma,
        chinese: (activeInspectWord.defs || []).join('；'),
        level: activeInspectWord.level || "A1",
        category: "生活情景生词",
        type: activeInspectWord.type || "常用词",
        exUz: "",
        exCn: ""
      };
      saved.push(newItem);
      localStorage.setItem(STORAGE_KEY, JSON.stringify(saved));
      updateBookmarkUI(lemma);
      alert(`🎉 成功将 “${lemma}” 收藏至核心词汇馆！`);
    }

    function getSavedVocab() {
      try {
        const s = localStorage.getItem(STORAGE_KEY);
        if (s) return JSON.parse(s) || [];
      } catch(e) {}
      return [];
    }

    // 音频播放控制
    function highlightLine(idx) {
      document.querySelectorAll('.chat-bubble-row').forEach(r => r.classList.remove('playing'));
      const row = document.getElementById(`lineRow_${idx}`);
      if (row) {
        row.classList.add('playing');
        row.scrollIntoView({ behavior: 'smooth', block: 'center' });
      }
      const total = DIALOGUES_DATA[currentDIdx].sentences.length;
      document.getElementById('playerStatusText').textContent = `播放中: ${idx + 1} / ${total}`;
    }

    function playSingleLine(e, idx) {
      if (e) e.stopPropagation();
      currentLineIdx = idx;
      playCurrentLine();
    }

    function playCurrentLine() {
      const d = DIALOGUES_DATA[currentDIdx];
      if (!d || !d.sentences[currentLineIdx]) return;

      const sent = d.sentences[currentLineIdx];
      highlightLine(currentLineIdx);

      dialogueAudio.src = sent.audio;
      dialogueAudio.playbackRate = activeSpeed;

      dialogueAudio.onended = () => {
        if (isPlaying) {
          if (currentLineIdx < d.sentences.length - 1) {
            currentLineIdx++;
            playCurrentLine();
          } else {
            pauseAudio();
            document.getElementById('playerStatusText').textContent = '已播完';
          }
        }
      };

      dialogueAudio.play().catch(() => {});
      isPlaying = true;
      document.getElementById('playerMainBtn').textContent = '⏸';
    }

    function togglePlayDialogue() {
      if (isPlaying) {
        pauseAudio();
      } else {
        isPlaying = true;
        document.getElementById('playerMainBtn').textContent = '⏸';
        playCurrentLine();
      }
    }

    function pauseAudio() {
      dialogueAudio.pause();
      isPlaying = false;
      const btn = document.getElementById('playerMainBtn');
      if (btn) btn.textContent = '▶';
    }

    function playPrevLine() {
      if (currentLineIdx > 0) {
        currentLineIdx--;
        playCurrentLine();
      }
    }

    function playNextLine() {
      const d = DIALOGUES_DATA[currentDIdx];
      if (d && currentLineIdx < d.sentences.length - 1) {
        currentLineIdx++;
        playCurrentLine();
      }
    }

    function toggleSpeed() {
      const speeds = [1.0, 0.8, 1.2];
      const nextIdx = (speeds.indexOf(activeSpeed) + 1) % speeds.length;
      activeSpeed = speeds[nextIdx];
      dialogueAudio.playbackRate = activeSpeed;
      document.getElementById('speedBtn').textContent = activeSpeed + 'x';
    }

    function toggleChineseTrans() {
      showChinese = !showChinese;
      document.querySelectorAll('.line-chinese').forEach(el => {
        if (showChinese) el.classList.remove('hidden');
        else el.classList.add('hidden');
      });
      document.getElementById('btnToggleTrans').textContent = showChinese ? '译文：开' : '译文：关';
    }

    let fontSize = 18;
    function changeFontSize(delta) {
      fontSize = Math.max(14, Math.min(26, fontSize + delta));
      document.querySelectorAll('.line-uzbek').forEach(el => el.style.fontSize = fontSize + 'px');
    }
  </script>
</body>
</html>
